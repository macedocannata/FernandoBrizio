ch as dams and water transfers, to generate energy, for industrial production and for food. Many of these activities are based on a polluting extractive economy, which contributes to the deregulation of the climate and of water flows on earth and to the increased retention of water outside natural systems. The production of livestock, cereals, [[#ceramic|ceramics]], textiles, furniture, machines, building materials and many other products causes enormous flows of water on a global scale, hidden flows, a kind of invisible flying rivers that circulate through trade. By way of example, and because it is never too much to remember, the transaction of a T-shirt implies the virtual trade of 2,700 litres of water, while a kilo of beef implies the use of 15,415 litres. In order to reveal other dimensions of the circulation of water, it is important to reflect on broad and inclusive strategies to represent and communicate not only these hidden flows and their relevance in the global economy of inequality, but also water as an omnipresent and vital relational flow, thereby developing a broader awareness of current water movements and uses of water.\n\n## Affective Geologies: The living history of a recipe\n\nThe taste of cherries also has the taste of water, of the water of the place where they grew. Flowers, plants, fruits and all foods are containers of water from the place where they were planted and harvested. Cherries are 82.6% moisture. An orange is only 10.4% orange; the rest is water. We often hear of people or places because of unique foods, meals and flavours, and of the impossibility of reproducing those flavours elsewhere when we use the same recipe. Water is one of the many factors that alter flavours. All waters have a different taste resulting from the mineral composition absorbed in the depths of the earth. These are geological flavours, brought from the bowels of the earth to the surface by water. To what extent do the availability and taste of the water used in growing and cooking food influence and nourish the flavours and the cuisine of a territory? How do they influence rituals, culture, memories, the construction of identity, the sense of belonging, the affective ties between people, and between people and places? This speculation on the social life of the taste of water may activate new imaginaries and knowledge, opening another perspective on the geographies of food, and on our relationship with the taste of water and of food. However, many other questions must be raised from the interaction between water, place, people and food. Critical questions that we must look at carefully, such as food insecurity and water scarcity, over-exploitation and environmental degradation, biodiversity and cultural diversity, social inequality and the consequent access to basic health care, climate change and its relationship with the exploitation of working conditions. The Latin expressions Cum (with) + panis (bread) are at the root of the words “company” and “companion”. A companion is, therefore, the one with whom we share bread, with whom we eat at the same [[#table|table]] (Tolentino Mendonça, 2011). We must seek and tell stories that help us reflect on an ethics of production, distribution and consumption of food and water, that ‘hydrate’ creativity, responsible and fair consumption, equity and sharing, commensality and the building of affections, the sense of community.", "footnotes": ["Bibliography of the curatorial proposal: Attala, L. (2019) How [[#water|Water]] Makes Us Human, engagements with the materiality of water. Cardiff: University of Wales Press. · Brízio, F. ([[#year-2007|2007]]) Desenho Habitado. In, Prémio Massimo Dutti Design. [[#lisbon|Lisbon]]: Grupo Regojo. · Brízio, F. ([[#year-2011|2011]]) Desenho Habitado. In, Fernando Brízio. Lisbon: [[#experimentadesign|Experimenta]] Design. · Jacob, I. – Promethean beasts. Aeon, 25 November [[#year-2021|2021]]. · [[#timothy-morton|Morton]], T. ([[#year-2013|2013]]) Realist [[#magic|Magic]]: Objects, Ontology, Causality. Ann Arbor: Open Humanities Press. · Tolbert, M. – Becoming Water, Black Memory in Slavery’s Afterlives. Emergence Magazine, 17 February 2022. · Tolentino Mendonça, J. (2011) Pai-Nosso que estais na terra. Lisbon: Paulinas."], "refs": [], "keywords": ["curating", "porto-design-biennale", "exh-ser-agua", "being-water", "water", "more-than-human", "design-of-the-human", "choreographers", "magic", "timothy-morton", "prometheus", "sharing", "porto", "parafiction", "year-2023", "anthropologist", "rain", "humidity", "stain", "fiction", "stone", "transformation", "ceramic", "table"], "images": [], "laid_out": true, "linked_from": ["aquilegium", "inhabited-drawing-text", "invisible-landscape", "petrichor"]}, {"id": "petrichor", "title": "Petrichor, the Smell of Rain", "year": 2023, "sheet": [["Title", "Petrichor, o Cheiro da Chuva / Petrichor, the Smell of Rain"], ["Event", "Porto Design Biennale 2023 — Being Water"], ["Venue", "Casa do Design, Matosinhos"], ["Dates", "19.10.2023 – 03.12.2023"], ["Curated by", "Fernando Brízio"], ["Cover photo", "Rain Vases, 2019 © Martín Azúa"], ["Category", "Curating"]], "text": "After a hot, dry period, the first drops of [[#water|water]] fall to the earth and give off the smell of [[#rain|rain]]. This phenomenon was named petrichor (from the Greek pétros, [[#stone|stone]] + īchor, ethereal fluid or blood of the gods, as understood in Greek mythology) in 1964 by Australian scientists Isabel Joy Bear and Richard G. Thomas. The aroma, which is often associated with the smell of the earth, is caused by the oils released by some plants during arid and hot periods, which have accumulated on the dry earth and clay. When the first droplets of rain fall, the oils deposited on the earth are suspended in the air in microdroplets which, when inhaled, give us the smell of rain. This odour seems to set off and fill our sensoria, i.e. the part of the brain that is thought to be the common core of all sensations. It’s like a call from the earth, which sometimes leads to introspection and recalling very old memories. It’s a scent that reactivates and creates memories, and that comes to us through water: the rainwater that falls and hits the earth; the water that hydrates plants, that transforms sap and organic matter; the droplets suspended in the air filled with little bits of plants.\n\nThe description of this chain of events is a simplification of what actually happens, but it introduces the idea of an aqueous fluid interface. We want to show places of communication, exchange, interaction/intra-action between types of water (in its various states) and between water and other agents, and to address the central role of water in the world. We want to emphasise the ubiquity of water, its presence and circulation in everything, everywhere, as a central element connecting all things. Water moulds everything, it is vital and without it, life would not exist. It can take many forms, manifesting them simultaneously. Water circulates within bodies and between animate and inanimate objects. We humans and more than humans, are connected by a common water flow, we share the same water that enters and exudes from our bodies and which, through biology, is transformed into other materials. Water circulating throughout the Earth, between flesh, plant and mineral matter, aqueous bodies that have shared the same water since the first spark of life millions of years ago, specifically from water.\n\nPetrichor — the clouds, the earth and the sense of smell, the pores of the skin, the roots of lemon balm, the leaves of a holm oak tree, the mycelium below the forest floor, flowers, the aquaporins in cell membranes. These are all natural fluid interfaces, which can be added to by many other human-designed ones. Fluid interfaces such as artificial heart valves, diving helmets, plant rafts, ship traffic trackers, underwater vehicles for mapping underground aquifers, greenhouses, artificial flowers for feeding bees and other pollinating [[#animals|insects]], systems for reusing water, calculators for cloning mining waters, synthesisers, sea grass caretakers, the use of bio-pigments.\n\nPetrichor’s content was gathered along six lines based on the curatorial text for this edition of the [[#porto-design-biennale|Porto Design Biennale]], [[pdb-2023-being-water|Being Water: How we flow together and shape each other]]:\n\n## Cannibals Dancing with Astronauts[^1] — Particle Accelerators\n\nMore than half of our body is water. The percentage varies with age and differs between men and women. The amount of water in the human body reaches a maximum of 70 per cent in the first few years of life and decreases over the years. We are amniotic beings; we come from water, but we ‘dry out’ throughout our lives.\n\nBased on material or immaterial human elaborations, this body of water can take on a variety of forms in different places, it can walk through space in an EVA suit, swim at the bottom of the ocean or, through music, experience other states of consciousness. It’s possible to have another body, to be another being. These and so many other human elaborations are tools that allow us to access another space and time; they protect us, help us gain knowledge, reorganise and build worlds, deal with fears and the unknown.\n\n## Reconnect\n\nIn this proposal, we reveal practices that consider collective bodies, co-operation and co-existence. Practices of empathy and sharing, of preservation and healing, hydration, nourishment, repair, talking to strangers, practices of caring for others, all of which are essential [[#gesture|gestures]] for our existence.\n\n## Geological Flavour\n\nEvery type of water has a different flavour based on the mineral composition absorbed deep within the earth. These are geological flavours, brought to the surface by water from the depths of the earth. The greater or lesser abundance of water, its flavour and other characteristics, such as its hardness, when used in agriculture and food preparation, influence flavour, the identity of a territory and the memories linked to it.\n\n## Hydrophilic Objects\n\nThe amount of water on Earth is thought to have remained stable for many thousands of years. However, population growth that replicates Western consumption patterns, increased pollution, the retention of water outside of natural systems, deforestation and deregulation of the climate and waterflows on earth mean that water scarcity is increasing dramatically. To enable access to and preservation of water, [[#collecting|collection]], reuse, purification and transport systems have been developed that operate on the various states of water.\n\n## Undercurrents: Hidden Flows\n\nUndercurrents is dedicated to working on representations of water. We show the hidden flows of water, multiple sources and states, scarcity, geopolitical tensions, and disputes between countries. We want to contribute to a broader awareness of water movements and water uses by thinking about the water, humanitarian and climate crises and geopolitical disputes we face.\n\n## Walking on Thin Ice\n\nIn Greek mythology, [[#prometheus|Prometheus]] gave humans fire and the possibility of progress, but it seems that this ability is now leading us towards a furnace. The current capacity for design, by pursuing an idea of progress based on the current prevailing model of happiness and economic growth, turns this human skill into an element that unbalances natural and climate systems. We have become geological agents. Individualism, vanity, greed, and an idea of, what is often superfluous comfort, are depleting the Earth. Growing awareness of the negative impact of human action has led to the development of design processes in a wide variety of areas production seeking to reduce impact on the planet. The list of these processes is endless, but insufficient if not accompanied by widespread changes in individual behaviour and resulting political measures. We will continue, it seems, to head towards a hurricane.", "footnotes": ["According to an expression by Catarina Portas in the text “Canibais dançando com astronautas” about dance as a vital need."], "refs": [], "keywords": ["curating", "rain", "water", "being-water", "exh-ser-agua", "porto-design-biennale", "porto", "year-2023", "stone", "animals", "gesture", "collecting", "prometheus"], "images": [], "linked_from": ["pdb-2023-being-water"]}, {"id": "aquilegium", "title": "Aquilégio – Conversations with those who find and keep water", "year": 2023, "sheet": [["Title", "Aquilégio — Conversas com aqueles que encontram e guardam a água / Aquilegum — Conversations with those who find and preserve water"], ["Event", "Porto Design Biennale 2023 — Being Water"], ["Dates and venues", "10.11.2023, Salão Nobre da Câmara Municipal de Matosinhos; 24.11.2023, Biblioteca da Fundação de Serralves, Porto"], ["Curated by", "Fernando Brízio"], ["Cover photo", "Tito Mouraz, Untitled (Fluvial series), 2017"], ["Category", "Curating – Talks"]], "text": "{sheet}\n\nThe programme of talks and debates Aquilegum — Conversations with those who find and preserve [[#water|water]] has been designed around six proposals: Non-existent borders; The taste of home; Undercurrents: hidden flows; Particle accelerators; Where water makes us human; Half man half whale. We bring brought together voices from multiple backgrounds who will share their work and thinking, fostering dialogues and plural encounters with water.\n\n## Non-existent Borders\n\nModerated by Catarina Leitão.\nIn an intertidal zone, the borders are constantly changing. The liquid tide covers and uncovers the land, but in between the coming and going it becomes entrenched, embedded in the damp sand, in the [[#stone|stones]] and beings of these areas’ ecosystems. On the bank of a river, water spirals creating deposits and eroding the edge of the land in an infinite process of [[#transformation|transformation]]. Water seeps into the earth, first liquid, then as wetness. We cannot be sure when it becomes muddy, then clay and finally soil.\nHere we bring together people who urge us to design and think about the intertwining of all things, proposing alternative models of relationship and order that encourage porous materiality, inclusive projects, interspecies dialogues and more equitable democracies.\n\n## The Taste of Home\n\nModerated by Mariana Sanchez Salvador.\nAll waters have a different taste, resulting from the mineralogical composition absorbed deep within the earth. These are geological flavours, brought to the surface by water from the depths of the earth. To what extent does the availability and taste of the water used to grow and cook food influence and nourish the flavours and gastronomy of a given region? To what extent do food and water influence rituals, culture and memories, the construction of identity and a sense of belonging? How does it shape emotional ties between people, and between people and places? These are some of the issues that our guests will be discussing. The aim of this speculation on the social life of water flavours is to activate new ideas and knowledge\n\n## Undercurrents: Hidden Flows\n\nModerated by [[#carla-cardoso|Carla Cardoso]].\nThis talk is centred around the narratives and representations of water. We invited Jane Withers, who through images, exhibition devices, communication objects and curatorial projects researches and reveals the ways and the places where water circulates. By revealing the hidden flows of water, its multiple sources and states, its vital importance and scarcity, it is possible to contribute to a broader awareness of water movements and uses, helping us to think about the climate and water crises we are facing.\n\n## Particle Accelerators\n\nModerated by Renato Bispo.\nIn this subject we bring together speakers who talk about material and immaterial devices such as suits, spaces and many other objects with the power to protect and transform bodies, granting access to another scope of space and time. These devices are instruments that help us deal with reality, with extreme situations, and fear.\n\n## Where Water Makes Us Human\n\nModerated by Teresa Fradique.\nWater is everywhere, it shapes everything; it is vital, and without it life would simply not be possible. Water can take on many forms, manifesting them all at once. It is a cast of the human: as it moves through our lives, we flow together and are formed collectively. Under the motto of Luci Attala’s book How water makes us human (University of Wales Press, 2019), the aim of this talk is to reveal how different types of water make us human by shaping bodies and beings, culture and social relations, myths and the sacred.\n\n## Half Man Half Whale\n\nModerated by Joana Rafael.\nThis session is dedicated to the water that moves between bodies. We humans and more than humans are connected by a common water flow; we share the same water that enters and exudes from our bodies and through biology becomes another matter. For this conversation — for which we have ‘borrowed’ the title of a novel by José Gardeazbal (Companhia da Letras, [[#year-2018|2018]]) — we bring together voices that reflect on water circulating on Earth, between flesh, plant and mineral matter, aqueous bodies that have shared the same water since the moment life emerged millions of years ago, from water in fact. The idea of a collective water/body should be enough to make us think about cooperation and coexistence, fairness for everyone, human and more than human, and ways of caring for each other.", "footnotes": [], "refs": [], "keywords": ["curating", "talk", "water", "being-water", "exh-ser-agua", "porto-design-biennale", "porto", "year-2023", "stone", "transformation", "carla-cardoso"], "images": [], "laid_out": true, "linked_from": ["pdb-2023-being-water"]}, {"id": "fluxes", "title": "Fluxes – Lisbon Architecture Triennale 2025 (MAAT)", "year": 2025, "s ], "page": "", "title_w": null, "hide_cards": [], "laid_out": false}, "year-2018": {"id": "year-2018", "label": "2018", "type": "year", "description": "", "projects": ["paradisaea"], "page": "", "title_w": null, "hide_cards": [], "laid_out": false}, "year-2021": {"id": "year-2021", "label": "2021", "type": "year", "description": "", "projects": ["pdb-2021"], "page": "", "title_w": null, "hide_cards": [], "laid_out": false}, "year-2023": {"id": "year-2023", "label": "2023", "type": "year", "description": "", "projects": ["aquilegium", "pdb-2023-being-water", "petrichor"], "page": "", "title_w": null, "hide_cards": [], "laid_out": false}, "year-2025": {"id": "year-2025", "label": "2025", "type": "year", "description": "", "projects": ["colecao-seminar", "fluxes", "lighter", "spectres"], "page": "", "title_w": null, "hide_cards": [], "laid_out": false}}, "pages": [{"id": "about", "title": "About", "title_w": 2, "page": "{space:4}\n\n{w:2} {infobox}\n\n{img:a001}\n\n{w:8} Fernando Brízio was born in [[#angola|Angola]], and studied Design in [[#lisbon|Lisbon]], where he currently lives and works. He has developed products for the industry sector, limited series, exhibitions, scenarios and spaces for companies and organisations like [[#droog|Droog Design]], [[#amorim|Amorim Cork]], [[#experimentadesign|Experimenta Design]], Nike, [[#adidas|Adidas]], [[#authentics|Authentics]], Fábrica [[#bordallo-pinheiro|Bordallo Pinheiro]], [[#il-coccio|Il Coccio]], Arena Ensemble, O Som e a Fúria, Museu de Serralves, [[#cristina-guerra|Cristina Guerra Contemporary Art]], [[#galerie-kreo|Galerie Kreo]], etc. His work has been exhibited and published internationally, and is sometimes developed independently, blurring disciplinary boundaries.\n\n{br}\n\n{w:8} Brízio has taught at [[#esad-cr|ESAD.CR]] since 1999, where he planned and coordinated several courses in the domains of product and space design. He was a professor at the Faculty of Fine Arts Lisbon-UL and a visiting professor at several institutions, like ECAL — École Cantonale d'Art in Lausanne, HFG — Karlsruhe University of Art Design and FCSH of the New University of Lisbon. He has participated in juries and lectures in Portugal and abroad. He has curated several projects and exhibitions, including [[scool-iberica|SCool Ibérica]] and [[paradisaea|Paradisaea Lux Frágil 20 anos]]. His works are part of the permanent collection of [[#mude|MUDE — Museu DO Design e da Moda de Lisboa]], and [[#ima|IMA — Museu de Arte de Indianapolis]], among other collections. Currently, and in addition to his ongoing projects, Fernando Brízio is a researcher at Lida — Laboratory in Design and Arts of the Polytechnic of Leiria and at the College of Arts of the University of Coimbra.\n\n{br}\n\n## Biography from the Desenho Habitado catalogue (2011)\n\n{w:8} Fernando Brízio graduated in Product Design (1996) from the Faculty of Fine Arts of the University of Lisbon, the city where he lives and works. Since then he has developed industrially produced objects as well as handmade limited series, alongside exhibitions, stage sets and interior and exterior spaces for companies and organisations such as [[#droog|Droog]], Schréder, [[#torino-wdc|Torino World Design Capital]], [[#experimentadesign|experimentadesign]], Lisbon City Council, [[#il-coccio|Il Coccio]], [[#cor-unum|Cor Unum]], Fábrica Rafael [[#bordallo-pinheiro|Bordallo Pinheiro]], [[#galerie-kreo|Galerie Kreo]] and the choreographer [[#rui-horta|Rui Horta]]. Professor and coordinator of the Master in Industrial Design at [[#esad-cr|ESAD.CR]], Fernando has taught at ECAL/Ecole Cantonal d'Art de Lausanne and at the HfG in Karlsruhe, taking part in numerous conferences and juries in Portugal and abroad. Exhibited and published internationally, his works are part of the permanent collection of [[#mude|MUDE – Museu do Design e da Moda]] in Lisbon, as well as several private collections.\n\n{br}\n\n{chronology}", "media": [{"id": "a001", "kind": "image", "file": <script>
const D = JSON.parse(document.getElementById('data').textContent);
const P = Object.fromEntries(D.projects.map(p => [p.id, p]));
const K = D.keywords;
// keyword types and their inks come from the backoffice; years are automatic
const TYPES = [...D.types.map(t => [t.id, t.label, t.ink]), ['year', 'Years', '#bdbdbd']];
const COL = Object.fromEntries(TYPES.map(([t,,c]) => [t, c]));
const TL = Object.fromEntries(TYPES.map(([t,l]) => [t, l]));
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// years and categories connect almost everything, so they start hidden
const shown = new Set(TYPES.map(t => t[0]).filter(t => !['year','category'].includes(t)));

// full graph: every project, every keyword with at least one project
const allNodes = [
  ...D.projects.map(p => ({id: 'p:' + p.id, ref: p.id, kind: 'p', label: p.title, year: p.year})),
  ...Object.values(K).filter(k => k.projects.length).map(k => ({id: 'k:' + k.id, ref: k.id, kind: 'k', type: k.type, label: k.label})),
];
const allLinks = [];
for (const p of D.projects) {
  for (const k of p.keywords) if (K[k].projects.length) allLinks.push({source: 'p:' + p.id, target: 'k:' + k, kind: 'tag'});
  for (const f of p.linked_from) allLinks.push({source: 'p:' + f, target: 'p:' + p.id, kind: 'text'});
}

document.getElementById('types').innerHTML = TYPES.map(([t, l, c]) =>
  `<label><input type="checkbox" value="${t}" ${shown.has(t) ? 'checked' : ''}><span class="dot" style="background:${c}"></span>${l}<span class="n">${Object.values(K).filter(k => k.type === t && k.projects.length).length}</span></label>`).join('');

const svg = d3.select('#svg');
const root = svg.append('g');
const gLinks = root.append('g'), gNodes = root.append('g');
const zoom = d3.zoom().scaleExtent([.15, 6]).on('zoom', e => root.attr('transform', e.transform));
svg.call(zoom).on('dblclick.zoom', null);
svg.on('click', e => { if (e.target === svg.node()) select(null); });

const sim = d3.forceSimulation()
  .force('link', d3.forceLink().id(d => d.id).distance(l => l.kind === 'text' ? 50 : 70).strength(.35))
  .force('charge', d3.forceManyBody().strength(-90))
  .force('x', d3.forceX().strength(.04)).force('y', d3.forceY().strength(.04))
  .force('collide', d3.forceCollide(d => d.r + 2));

const pos = {};          // keep positions when filters change
let nodes, links, nodeSel, linkSel, adj, selected = null;

function rebuild(){
  const showText = document.getElementById('showText').checked;
  nodes = allNodes.filter(n => n.kind === 'p' || shown.has(n.type)).map(n => Object.assign(n, pos[n.id] || {}));
  const ids = new Set(nodes.map(n => n.id));
  links = allLinks.filter(l => (l.kind === 'tag' || showText) && ids.has(l.source.id || l.source) && ids.has(l.target.id || l.target))
    .map(l => ({source: l.source.id || l.source, target: l.target.id || l.target, kind: l.kind}));
  adj = {};
  for (const n of nodes) adj[n.id] = new Set();
  for (const l of links) { adj[l.source].add(l.target); adj[l.target].add(l.source); }
  for (const n of nodes) n.r = n.kind === 'p' ? 3.5 + Math.sqrt(adj[n.id].size) * 1.1 : 3 + Math.sqrt(adj[n.id].size) * 1.9;

  linkSel = gLinks.selectAll('line').data(links, l => l.source + '>' + l.target)
    .join('line').attr('class', l => 'link ' + l.kind);
  nodeSel = gNodes.selectAll('g.node').data(nodes, n => n.id)
    .join(enter => {
      const g = enter.append('g').attr('class', 'node')
        .on('click', (e, d) => { e.stopPropagation(); select(d); })
        .on('dblclick', (e, d) => { location.href = wikiHref(d); })
        .on('mouseenter', (e, d) => { if (!selected) highlight(d); })
        .on('mouseleave', () => { if (!selected) highlight(null); })
        .call(d3.drag()
          .on('start', (e, d) => { if (!e.active) sim.alphaTarget(.2).restart(); d.fx = d.x; d.fy = d.y; })
          .on('drag', (e, d) => { d.fx = e.x; d.fy = e.y; })
          .on('end', (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }));
      g.append('circle'); g.append('rect'); g.append('title'); g.append('text');
      return g;
    });
  // keywords: dots in their type's ink; projects: small boxes like the site's
  nodeSel.select('circle').attr('r', d => d.r).attr('fill', d => COL[d.type]).style('display', d => d.kind === 'p' ? 'none' : null);
  nodeSel.select('rect').attr('x', d => -d.r).attr('y', d => -d.r).attr('width', d => d.r * 2).attr('height', d => d.r * 2).style('display', d => d.kind === 'p' ? null : 'none');
  nodeSel.select('title').text(d => d.kind === 'p' ? `${d.label} (${d.year || 'n.d.'})` : `${d.label} · ${TL[d.type]}`);
  nodeSel.select('text').text(d => d.label.length > 34 ? d.label.slice(0, 32) + '…' : d.label)
    .attr('x', d => d.r + 3).attr('y', 3.5)
    .style('font-style', d => d.kind === 'k' ? 'italic' : null);
  updateLabels();

  sim.nodes(nodes).on('tick', () => {
    linkSel.attr('x1', l => l.source.x).attr('y1', l => l.source.y).attr('x2', l => l.target.x).attr('y2', l => l.target.y);
    nodeSel.attr('transform', d => `translate(${d.x},${d.y})`);
    for (const n of nodes) pos[n.id] = {x: n.x, y: n.y};
  });
  sim.force('link').links(links);
  sim.alpha(.6).restart();
  if (selected && !ids.has(selected.id)) select(null); else if (selected) select(selected);
  document.getElementById('legend').textContent = `${nodes.filter(n => n.kind === 'p').length} projects · ${nodes.filter(n => n.kind === 'k').length} keywords · ${links.length} connections`;
}

function updateLabels(){
  const on = document.getElementById('showLabels').checked;
  // projects always labelled; keywords only when they connect several projects, to keep it readable
  nodeSel.select('text').style('display', d => !on ? 'none' : (d.kind === 'p' || adj[d.id].size >= 3 || (selected && (d === selected || adj[selected.id].has(d.id)))) ? null : 'none');
}

function highlight(d){
  if (!d) { nodeSel.classed('dim', false).classed('hl', false); linkSel.classed('dim', false); return; }
  const nb = adj[d.id];
  nodeSel.classed('dim', n => n !== d && !nb.has(n.id)).classed('hl', n => n === d);
  linkSel.classed('dim', l => l.source.id !== d.id && l.target.id !== d.id);
}

const wikiHref = d => `/FernandoBrizio/${d.ref}`;
const nodeLink = id => { const n = allNodes.find(x => x.id === id); return `<a href="#" data-id="${n.id}">${esc(n.label)}</a>`; };

function select(d){
  selected = d;
  highlight(d);
  updateLabels();
  const box = document.getElementById('info');
  if (!d) { box.style.display = 'none'; return; }
  let html = `<a class="x" href="#" data-close>✕</a><h2>${esc(d.label)}</h2>`;
  if (d.kind === 'p') {
    const p = P[d.ref];
    const byType = {};
    for (const k of p.keywords) if (shown.has(K[k].type)) (byType[K[k].type] ||= []).push(k);
    html += `<div class="from">Project · ${p.year || 'n.d.'} · <a href="${wikiHref(d)}">open page</a></div>`;
    const out = links.filter(l => l.kind === 'text' && l.source.id === d.id).map(l => l.target.id);
    const inn = links.filter(l => l.kind === 'text' && l.target.id === d.id).map(l => l.source.id);
    if (out.length) html += `<h3>Its text links to</h3><ul>${out.map(id => `<li>${nodeLink(id)}</li>`).join('')}</ul>`;
    if (inn.length) html += `<h3>Linked from</h3><ul>${inn.map(id => `<li>${nodeLink(id)}</li>`).join('')}</ul>`;
    for (const [t, l] of TYPES) if (byType[t]) html += `<h3>${l}</h3><ul>${byType[t].map(k => `<li>${nodeLink('k:' + k)} <span class="rel">(${K[k].projects.length - 1})</span></li>`).join('')}</ul>`;
  } else {
    const k = K[d.ref];
    html += `<div class="from">Keyword · ${TL[k.type]} · ${k.projects.length} project${k.projects.length === 1 ? '' : 's'} · <a href="${wikiHref(d)}">open page</a></div>`;
    if (k.description) html += `<p>${esc(k.description)}</p>`;
    html += `<ul>${k.projects.map(id => `<li>${nodeLink('p:' + id)} <span class="rel">${P[id].year || 'n.d.'}</span></li>`).join('')}</ul>`;
  }
  box.innerHTML = html;
  box.style.display = 'flex';
  box.scrollTop = 0;
}

function focusOn(id){
  const n = nodes.find(x => x.id === id);
  if (!n) return;
  select(n);
  const {width, height} = svg.node().getBoundingClientRect();
  svg.transition().duration(600).call(zoom.transform, d3.zoomIdentity.translate(width / 2, height / 2).scale(1.6).translate(-n.x, -n.y));
}

document.getElementById('info').addEventListener('click', e => {
  const a = e.target.closest('a');
  if (!a) return;
  if (a.dataset.close !== undefined) { e.preventDefault(); select(null); }
  else if (a.dataset.id) {
    e.preventDefault();
    const n = allNodes.find(x => x.id === a.dataset.id);
    if (n.kind === 'k' && !shown.has(n.type)) { shown.add(n.type); document.querySelector(`#types input[value="${n.type}"]`).checked = true; rebuild(); }
    focusOn(a.dataset.id);
  }
});
document.getElementById('types').addEventListener('change', e => { e.target.checked ? shown.add(e.target.value) : shown.delete(e.target.value); rebuild(); });
document.getElementById('all').onclick = () => { document.querySelectorAll('#types input').forEach(i => { i.checked = true; shown.add(i.value); }); rebuild(); };
document.getElementById('none').onclick = () => { document.querySelectorAll('#types input').forEach(i => { i.checked = false; shown.delete(i.value); }); rebuild(); };
document.getElementById('showText').onchange = rebuild;
document.getElementById('showLabels').onchange = updateLabels;

const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
document.getElementById('q').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const q = norm(e.target.value.trim());
  if (!q) return;
  const n = nodes.find(x => norm(x.label) === q) || nodes.find(x => norm(x.label).startsWith(q)) || nodes.find(x => norm(x.label).includes(q));
  if (n) focusOn(n.id);
});

rebuild();
// open on a given node: graph.html#p/umbrella or #k/water
const fromHash = delay => {
  const h = decodeURIComponent(location.hash.slice(1)).split('/');
  if (h.length !== 2) return false;
  const n = allNodes.find(x => x.id === h[0] + ':' + h[1]);
  if (n && n.kind === 'k' && !shown.has(n.type)) { shown.add(n.type); document.querySelector(`#types input[value="${n.type}"]`).checked = true; rebuild(); }
  setTimeout(() => focusOn(h[0] + ':' + h[1]), delay);
  return true;
};
window.addEventListener('hashchange', () => fromHash(0));
if (!fromHash(1200)) svg.call(zoom.transform, d3.zoomIdentity.translate(svg.node().clientWidth / 2, svg.node().clientHeight / 2).scale(.75));
</script>
</body>
</html>
