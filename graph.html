<style>
/* The graph in the site's language (Figma "93 Fernando Brízio UI 01"): grey ground, boxes with a
   1px black line, Times in three sizes (24/28, 18/20, 12/14), blue links, the menu at top left. */
:root{--bg:#dbdbdb;--box:#e9e9e9;--line:#000;--link:#0032ff;--hl:#b3c2ff;--m:8px;--h:4px;
  --text:24px;--text-lh:28px;--cap:18px;--cap-lh:20px;--foot:12px;--foot-lh:14px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:#000;font-family:"Times New Roman",Times,serif;font-size:var(--cap);line-height:var(--cap-lh);overflow:hidden}
a{color:var(--link);text-decoration:underline;text-underline-position:from-font}
.box{background:var(--box);border:1px solid var(--line);padding:var(--h) var(--m) var(--m)}
.stack{display:flex;flex-direction:column}
.stack>.box+.box,.stack>.box+.stack>.box:first-child{border-top:0}
#stage{position:fixed;inset:0}
svg{width:100%;height:100%;display:block;cursor:grab}
svg:active{cursor:grabbing}
/* left column: menu, then the controls */
#side{position:fixed;left:var(--m);top:var(--m);bottom:var(--m);width:204px;display:flex;flex-direction:column;gap:var(--m);z-index:5;pointer-events:none}
#side>*{pointer-events:auto}
.nav .box{padding:var(--h) var(--m);white-space:nowrap}
.nav a{text-decoration:none}
.nav .home{color:#000}
#title{position:fixed;left:calc(var(--m) * 2 + 204px);top:var(--m);z-index:5;font-weight:bold;font-size:var(--text);line-height:var(--text-lh);padding:var(--h) var(--m)}
#controls{overflow:auto;min-height:0}
#controls input[type=search]{width:100%;border:1px solid var(--line);background:#fff;font:inherit;padding:2px 4px;border-radius:0}
#controls input[type=search]:focus{outline:none;background:var(--hl)}
#controls label{display:flex;align-items:center;gap:6px;cursor:pointer;margin:2px 0}
#controls label .dot{width:10px;height:10px;border-radius:50%;flex:none}
#controls label .sq{width:10px;height:10px;flex:none;background:var(--box);border:1px solid #000}
#controls label .ln{width:14px;height:0;border-top:2px solid var(--link);flex:none}
#controls label .n{color:var(--link);margin-left:auto}
#controls input[type=checkbox]{accent-color:var(--link);margin:0}
#controls .ttl{font-weight:bold}
#controls button{font:inherit;color:var(--link);background:none;border:0;padding:0;margin-right:12px;text-decoration:underline;cursor:pointer}
#controls .small{font-size:var(--foot);line-height:var(--foot-lh)}
/* nodes and lines */
.link{stroke:#000;stroke-opacity:.22;stroke-width:.7}
.link.text{stroke:var(--link);stroke-opacity:.8;stroke-width:1.2}
.node circle{cursor:pointer}
.node rect{cursor:pointer;fill:var(--box);stroke:#000;stroke-width:1}
.node text{font-size:var(--foot);fill:#000;pointer-events:none;paint-order:stroke;stroke:var(--bg);stroke-width:3px;stroke-linejoin:round}
.dim{opacity:.1}
.hl circle,.hl rect{stroke:var(--link);stroke-width:2.5}
/* the details of the chosen project or keyword: a stack of boxes at the right */
#info{position:fixed;top:var(--m);right:var(--m);width:310px;max-height:calc(100% - 16px);overflow:auto;display:none;flex-direction:column;z-index:5}
#info>*{background:var(--box);border:1px solid var(--line);margin:0;padding:var(--h) var(--m) var(--m)}
#info>*+*{border-top:0}
#info h2{font-size:var(--text);line-height:var(--text-lh);font-weight:bold;padding-right:32px}
#info .from,#info p{font-size:var(--cap);line-height:var(--cap-lh)}
#info h3{font-size:var(--cap);line-height:var(--cap-lh);font-weight:bold;background:var(--hl)}
#info ul{list-style:none;padding:var(--h) var(--m) var(--m)}
#info .x{position:absolute;right:calc(var(--m) * 2);top:calc(var(--m) + 4px);padding:0;border:0;background:none;color:#000;text-decoration:none;font-size:var(--text);line-height:var(--text-lh)}
.rel{color:var(--link)}
#legend{position:fixed;left:calc(var(--m) * 2 + 204px);bottom:var(--m);z-index:5;font-size:var(--foot);line-height:var(--foot-lh);padding:var(--h) var(--m)}
@media (max-width:720px){
  #side{bottom:auto;max-height:46%;width:calc(100% - 16px)}
  #title{display:none}
  #info{left:var(--m);width:auto;top:auto;bottom:var(--m);max-height:50%}
}
</style>

ywords": ["glass", "year-2001"], "images": [], "linked_from": []}, {"id": "potter", "title": "Potter", "year": 2001, "sheet": [["Title", "Potter"], ["Year", "2001"]], "text": "[[#bowl-plate|Bowl]] with a PVC rim, made by the designer.", "footnotes": [], "refs": [], "keywords": ["bowl-plate", "prototype", "year-2001"], "images": [], "linked_from": []}, {"id": "pixel", "title": "Pixel", "year": 2001, "sheet": [["Title", "Pixel"], ["Year", "2001"]], "text": "Stage set for the choreographer [[#rui-horta|Rui Horta]]: a [[#wood|wood]] and [[#metal|metal]] corridor with a rear-projection screen driven by the performer. Best Dance Show [[#year-2001|2001]] (Acarte / Maria Madalena de Azeredo Perdigão award). A literal case of [[#choreographers|designers as choreographers]].", "footnotes": [], "refs": [], "keywords": ["stage-design", "rui-horta", "choreographers", "experimentadesign", "wood", "metal", "year-2001"], "images": [], "linked_from": []}, {"id": "cesto", "title": "Cesto", "year": 2002, "sheet": [["Title", "Cesto"], ["Year", "2002"]], "text": "A wicker extension cord with electrical components, for DIM – Die Imaginäre Manufaktur. A link to basket makers, a craft that is disappearing ([[#delfim-sardo|Sardo]]).", "footnotes": [], "refs": [], "keywords": ["archetypes", "delfim-sardo", "material-first", "year-2002"], "images": [], "linked_from": []}, {"id": "sound-wave-bonbon", "title": "Sound Wave Bonbon", "year": 2003, "sheet": [["Title", "Sound System – Sound wave bonbon"], ["Year", "2003"], ["Material", "Chocolate"], ["Dimensions", "ø 2.5 x 6.7 cm"], ["Initiated by", "the author"], ["Producer", "Fernando Brízio"], ["Category", "Prototype"]], "text": "[[#sound-system-series|Sound System]] is a drawing process in which the [[#sound|sound]] generated by words is used to sketch objects. By saying the name of the type of object I intend to design/build, I produce a sound wave that is turned into a mark by sound software. That mark is used as the matrix of the object's final form. Then the sketch produced by the word is adapted to the functional requirements of the object and to a construction process. [[sound-wave-jar|Jar]], [[sound-wave-lamp|Lamp]] and the model for the bonbon were built by stacking [[#laser|laser]]-cut washers.\n\nWhen I say a word and it turns into an object, I like to imagine that the object comes out of my mouth. Although I like to think of similarities with [[#aladdin|Aladdin]]'s wonderful [[#lamp|lamp]] (in which a magician materialises the wishes spoken by Aladdin), Sound System is limited, falling far short of the number of formulations allowed by the genie of the lamp or by the conventional drawing process. Sound System applies only to types of objects with few constraints of use, which therefore allow great freedom and variability.", "footnotes": [], "refs": [], "keywords": ["sound-system-series", "chocolate", "food", "sound", "word-into-object", "prototype", "laser", "withdrawn-hand", "filomena-silvano", "year-2003", "aladdin", "lamp"], "images": [{"id": "i288", "kind": "image", "file": "img/i288.jpg", "caption": "[[#sound|Sound]] Wave Bonbon ([[#year-2003|2003]]): the stacked-washer model and the [[#chocolate|chocolate]] bonbon.", "credit": "", "info": "1400x1051", "src": "BOMBOM_02.tif", "wh": [1400, 1051], "v": [480, 960, 1400]}, {"id": "i289", "kind": "image", "file": "img/i289.jpg", "caption": "[[#sound|Sound]] Wave Bonbon ([[#year-2003|2003]]): the [[#aluminium|aluminium]] model and the [[#chocolate|chocolate]] bonbon, second view.", "credit": "", "info": "1400x1051", "src": "BOMBOM_04.tif", "wh": [1400, 1051], "v": [480, 960, 1400]}, {"id": "i290", "kind": "image", "file": "img/i290.jpg", "caption": "[[#sound-system-series|Sound System]] ([[#year-2003|2003]]): the [[#sound|sound]] waves of the words \"[[#vessel|jar]]\", \"[[#lamp|lamp]]\" and \"bombom\".", "credit": "", "info": "1400x390", "src": "Sound Waves-jar-lamp-bombom-3096.jpg", "wh": [1400, 390], "v": [480, 960, 1400]}, {"id": "i291", "kin  #1 / #2 / #3", "year": 2004, "sheet": [["Title", "Table Layered Carpet #1 / #2 / #3"], ["Year", "2004"]], "text": "[[#table|Tables]] made of layered [[#carpet|carpet]] and [[#metal|metal]], the basic variations of the idea of a table ([[#vera-sacchetti|Sacchetti]]). Made for [[#lux-fragil|Lux]] / Loja da Atalaia.", "footnotes": [], "refs": [], "keywords": ["carpet", "metal", "table", "archetypes", "lux-fragil", "vera-sacchetti", "year-2004"], "images": [], "linked_from": []}, {"id": "batuta-madame-butterfly", "title": "Baton for Madame Butterfly", "year": 2004, "sheet": [["Title", "Baton for Madame Butterfly"], ["Year", "2004"]], "text": "A conductor's baton with butterflies, for \"Au Doigt & à la Baguette\", ECAL / MUDAC, Lausanne.", "footnotes": [], "refs": [], "keywords": ["animals", "sound", "year-2004"], "images": [], "linked_from": []}, {"id": "painting-with-giotto", "title": "Painting with Giotto #1 / #3", "year": 2005, "sheet": [["Title", "Painting with Giotto #1 / #3"], ["Year", "2005"], ["Material", "Ceramic (faience), metal and felt-tip pens"], ["Dimensions", "ø 29 x 39 cm – ø 21 x 30 cm"], ["Initiated by", "the author"], ["Producer", "Atelier Fernando Brízio, Secla"], ["Publisher", "Galerie Kreo, Paris"], ["Category", "Limited edition"], ["Collection", "Indianapolis Museum of Art; MUDE – Museu do Design e da Moda, Lisbon; Colecção Francisco Capelo, Lisbon; private collections"]], "text": "I worked for many years next to my mother. While she watched television I drew at the living-room [[#table|table]] beside her; it was pleasant and irritating. Pleasant because I [[#felt|felt]] accompanied, irritating because of the comments she sometimes made about what I was doing. After work I would sometimes leave things on the table. A day or two later nothing was in its place, some drawings had disappeared and, now and then, the tablecloth appeared [[#stain|stained]] because of the pens that had been left uncapped. Over time I began to find those stains intriguing and fascinating; sometimes they happened in my trouser pockets. At a certain point I started to want to do something with them; it took me a while to manage it. In [[#year-2005|2005]] I developed the Giotto pieces for the exhibition [[#exh-97|97]]; the first prototype was started at 2 in the morning. I placed a ring of pens on top of the [[#bowl-plate|bowl]] and went to bed; the next day I woke up early, anxious. I was like a kid on Christmas morning. That night was Christmas.", "footnotes": [], "refs": [], "keywords": ["giotto-series", "painting-with-series", "giotto", "ceramic", "felt-tip-pen", "capillarity", "stain", "time", "chance", "withdrawn-hand", "memory", "limited-edition", "galerie-kreo", "secla", "mude", "ima", "capelo", "exh-97", "vera-sacchetti", "filomena-silvano", "delfim-sardo", "material-first", "designer-as-author", "paris", "cristina-guerra", "year-2005", "table", "felt", "bowl-plate"], "images": [{"id": "i139", "kind": "image", "file": "img/i139.jpg", "caption": "Painting with Giotto ([[#year-2005|2005]]): a white [[#ceramic|earthenware]] [[#vessel|pot]] with a ring of [[#felt-tip-pen|felt-tip pens]] around the rim, the colour soaking down.", "credit": "", "info": "1144x1400", "src": "1.6-2907.jpg", "wh": [1144, 1400], "v": [480, 960, 1144]}, {"id": "i140", "kind": "image", "file": "img/i140.jpg", "caption": "Painting with Giotto ([[#year-2005|2005]]): the [[#vessel|pot]] with its ring of pens, second view.", "credit": "", "info": "1144x1400", "src": "1.7-2910.jpg", "wh": [1144, 1400], "v": [480, 960, 1144]}, {"id": "i141", "kind": "image", "file": "img/i141.jpg", "caption": "Painting with Giotto ([[#year-2005|2005]]): a round [[#vessel|vase]] bristling with pens, each leaving a coloured [[#stain|spot]].", "credit": "", "info": "1051x1400", "src": "2 SESSÃO|09-29-small-1702.jpg", "wh": [1051, 1400], "v": [480, 960, 1051]}, {"id": "i142", "kind": "image", "file": "img/i142.jpg", "caption": "Painting with Giotto ([[#year-2005|2005]]): the round : "Painting with Giotto ([[#paper|paper]]): a row of green pens, the [[#stain|stains]] running down the sheet.", "credit": "", "info": "933x1400", "src": "S__03430_8e-small-543.jpg", "wh": [933, 1400], "v": [480, 933]}, {"id": "i213", "kind": "image", "file": "img/i213.jpg", "caption": "Painting with Giotto ([[#paper|paper]]): a composition of yellow, red, pink and black [[#stain|stains]].", "credit": "", "info": "933x1400", "src": "S__03585_2-small-489.jpg", "wh": [933, 1400], "v": [480, 933]}, {"id": "i214", "kind": "image", "file": "img/i214.jpg", "caption": "Painting with Giotto ([[#paper|paper]]): a composition of orange, blue and green [[#stain|stains]].", "credit": "", "info": "933x1400", "src": "S__03585_4-small-495.jpg", "wh": [933, 1400], "v": [480, 933]}, {"id": "i215", "kind": "image", "file": "img/i215.jpg", "caption": "Painting with Giotto ([[#paper|paper]]): \"Coroa\" (crown), a ring of small coloured dots.", "credit": "", "info": "961x1400", "src": "coroa-small-1975.jpg", "wh": [961, 1400], "v": [480, 960, 961]}, {"id": "i216", "kind": "image", "file": "img/i216.jpg", "caption": "Drawing: pens hanging from small hooks, a study for the [[#paper|paper]] holders.", "credit": "", "info": "1400x1078", "src": "desenho-308.jpg", "wh": [1400, 1078], "v": [480, 960, 1400]}, {"id": "i217", "kind": "image", "file": "img/i217.jpg", "caption": "Painting with Giotto ([[#paper|paper]]): three strips of [[#stain|stain]] patterns: brown blots, a green and yellow band, rings of colour.", "credit": "", "info": "1054x1400", "src": "manchas-papelFINAL_maior-1986.jpg", "wh": [1054, 1400], "v": [480, 960, 1054]}], "linked_from": []}, {"id": "clothes-make-up", "title": "Clothes Make Up (skirt)", "year": 2005, "sheet": [["Title", "Clothes Make Up (skirt)"], ["Year", "2005"]], "text": "{sheet}\n\n{img:i228}\n\n[[#dress|Skirt]] [[#stain|stained]] by [[#felt-tip-pen|felt-tip pens]]. The idea of the [[restarted-dress|Restarted Dress]] was first sketched on it.\n\n{img:i229}\n\n{w:7} {imglist}", "footnotes": [], "refs": [], "keywords": ["giotto-series", "fabric", "dress", "felt-tip-pen", "capillarity", "open-objects", "happening-objects", "year-2005", "stain"], "images": [{"id": "i228", "kind": "image", "file": "img/i228.jpg", "caption": "Clothes Make Up ([[#year-2005|2005]]): a white [[#dress|skirt]] with [[#felt-tip-pen|felt-tip pens]] in its pockets and large coloured [[#stain|stains]], on black.", "credit": "", "info": "1400x1367", "w": 2, "src": "saia fundo preto-small-1896.jpg", "wh": [1400, 1367], "v": [480, 960, 1400]}, {"id": "i229", "kind": "image", "file": "img/i229.jpg", "caption": "Clothes Make Up ([[#year-2005|2005]]): the [[#dress|skirt]], second view.", "credit": "", "info": "1400x1325", "w": 7, "src": "saia preta+área-small-1563.jpg", "wh": [1400, 1325], "v": [480, 960, 1400]}], "laid_out": true, "linked_from": ["restarted-dress"]}, {"id": "hb-drawing-shelf", "title": "HB Drawing Shelf", "year": 2005, "sheet": [["Title", "Drawing Shelf"], ["Year", "2005"], ["Material", "Wood and pencils"], ["Dimensions", "133 x 43 x 13 cm"], ["Initiated by", "the author"], ["Producer", "Atelier Fernando Brízio, Cenycet"], ["Publisher", "Galerie Kreo, Paris"], ["Category", "Limited edition"], ["Collection", "MUDE – Museu do Design e da Moda; Colecção Francisco Capelo"]], "text": "The [[#shelf|shelf]]’s backboard, adjacent to the wall, is covered with [[#hb-pencil|HB pencils]].\nFrom these pencils, several lines stretch out and away, as if the object drew them as it was moved back and forth until reaching its final, correct set position.\nThese lines are inductive of an [[#apparent-movement|apparent movement]].\n\nPiece made for the exhibition [[#exh-97|97]] ([[#year-2005|2005]]); from [[#year-2007|2007]] it was published by the [[#galerie-kreo|Kreo]] gallery.", "footnotes": [], "refs": [], "keywords": ["wood", "hb-pencil", "shelf", "drawing-machines", "apparent-movement", "illusion", "inhabited-drawing", "limited-edition", "galerie-kreo", "cenycet", "mude", "capelo", "exh-97", "vera-sacchetti", "susana-gaudencio", "designer-as-author", "paris", "cristina-guerra", "year-2005"], "images": [{"id": "i232", "kind": "image", "file": "img/i232.jpg", "caption": "HB Drawing [[#shelf|Shelf]] ([[#year-2005|2005]]): the shelf on the wall, the [[#hb-pencil|pencil]] lines trailing behind it.", "credit": "", "info": "1400x1224", "src": "4.1-HB Drawing Shelf-3234.jpg", "wh": [1400, 1224], "v": [480, 960, 1400]}, {"id": "i233", "kind": "image", "file": "img/i233.jpg", "caption": "HB Drawing [[#shelf|Shelf]] ([[#year-2005|2005]]), detail: the [[#hb-pencil|HB pencils]] on the back and the lines they drew.", "credit": "", "info": "1400x1400", "src": "4.3-HB Drawing Shelf-3229.jpg", "wh": [1400, 1400], "v": [480, 960, 1400]}, {"id": "i234", "kind": "image", "file": "img/i234.jpg", "caption": "HB Drawing [[#shelf|Shelf]] ([[#year-2005|2005]]): the shelf and its lines.", "credit": "", "info": "1400x912", "src": "4.4-HB Drawing Shelf-3232.jpg", "wh": [1400, 912], "v": [480, 960, 1400]}], "linked_from": ["furo", "sketching-door"]}, {"id": "specter", "title": "Specter", "year": 2005, "sheet": [["Title", "Specter"], ["Year", "2005"]], "text": "Sideboard in [[#wood|wood]], [[#metal|metal]], magnet and a duster cloth, for [[#exh-97|97]].", "footnotes": [], "refs": [], "keywords": ["wood", "metal", "exh-97", "cristina-guerra", "year-2005"], "images": [], "linked_from": []}, {"id": "viagem", "title": "Viagem / Journey", "year": 2005, "sheet": [["Title", "Viagem / Journey"], ["Year", "2005"]], "text": "Fresh [[#ceramic|porcelain]] [[#vessel|bottles]], pots and [[#bowl-plate|bowls]] are put inside a jeep driven along a deliberately rough route. Acceleration, sudden stops and curves [[#deformation|deform]] them, so the shapes record the trip. \"A poetic and melancholic process\" ([[#vera-sacchetti|Sacchetti]]). As with [[painting-with-giotto|Giotto]], the designer [[#withdrawn-hand|withdraws]] from direct contact with matter ([[#filomena-silvano|Silvano]]).", "footnotes": [], "refs": [], "keywords": ["ceramic", "deformation", "time", "chance", "withdrawn-hand", "video", "exh-97", "memory", "vera-sacchetti", "filomena-silvano", "susana-gaudencio", "cristina-guerra", "year-2005", "vessel", "bowl-plate"], "images": [], "linked_from": ["esmagamento"]}, {"id": "singing-water-jar", "title": "Singing Water Jar", "year": 2005, "sheet": [["Title", "Singing Water Jar"], ["Year", "2005"]], "text": "An opaque tin [[#water|water]] [[#vessel|jar]] that sings when it is used ([[#vera-sacchetti|Sacchetti]]).", "footnotes": [], "refs": [], "keywords": ["metal", "vessel", "water", "sound", "animals", "humour", "vera-sacchetti", "year-2005"], "images": [], "linked_from": []}, {"id": "salt-and-pepper", "title": "Salt and Pepper Shakers", "year": 2005, "sheet": [["Title", "Salt and Pepper Shakers"], ["Year", "2005"]], "text": "[[#ceramic|Ceramic]] shakers for [[#cor-unum|Cor Unum]] (Netherlands).", "footnotes": [], "refs": [], "keywords": ["ceramic", "cor-unum", "food", "year-2005"], "images": [], "linked_from": []}, {"id": "window", "title": "Window", "year": 2005, "sheet": [["Title", "Window"], ["Year", "2005"]], "text": "Installation in [[#wood|wood]] and furniture for \"Reshuffle\", Pavilhão Branco, [[#lisbon|Lisbon]].", "footnotes": [], "refs": [], "keywords": ["wood", "interior", "lisbon", "year-2005"], "images": [], "linked_from": []}, {"id": "scool-iberica", "title": "S*Cool Ibérica", "year": 2005, "sheet": [["Title", "S*Cool Ibérica"], ["Year", "2005"]], "text": "Curated for [[#experimentadesign|ExperimentaDesign]].", "footnotes": [], "refs": [], "keywords": ["curating", "experimentadesign", "guta-moura-guedes", "year-2005"], "images": [], "linked_from": []}, {"id": "pata-negra-trancheuse", "title": "Pata Negra avec Trancheuse", "year": 2006, "sheet": [["Title", "Pata Negra avec Trancheuse"], ["Year", "2006"]], "text": "[[#wood|Wood]] sculpture/[[#table|table]] with a slicer, a follow-up to [[pata-negra|Pata Negra]], for \"Toxic\" ([[#paulo-mendes|Paulo Mendes]]).", "footnotes": [], "refs": [], "keywords": ["wood", "food", "paulo-mendes", "humour", "year-2006", "table"], "images": [], "linked_from": ["pata-negra"]}, {"id": "inhabited-drawing-text", "title": "Inhabited Drawing (text)", "year": 2007, "sheet": [["Title", "Desenho Habitado (Inhabited Drawing)"], ["Year", "2007"], ["Category", "Text"], ["Published in", "Prémio Massimo Dutti Design, Lisbon: Grupo Regojo, 2007; Fernando Brízio – Desenho Habitado, Lisbon: experimentadesign, 2011"]], "text": "A long time ago I saw a scene from a Buster [[#buster-keaton|Keaton]] film that remained [[#latency|latent]] in my memory and that, some years later, made me go looking for it. I found it in The High Sign. In this film BK picks up a can of [[#paint|paint]] and a brush, goes up to a wall, draws a coat hook and then hangs up his hat. When I saw this I recognised myself in what had just happened in front of me; it seemed that Keaton was personifying a designer.\n\nFor some of his films he conceived magnificent scenic devices in which objects, houses, systems and mechanisms surprise through their ingenuity and [[#humour|humour]], taking on a central role in the unfolding of the story: the swapped numbering of the boxes containing a prefabricated house makes him, in the film One Week (1920), build a house whose walls, windows and [[#door|doors]] end up crooked/oblique; the final result looks, in formal terms, like a deconstructivist building. In The Scarecrow the set is concentrated in a small room that holds bedroom, dining room and kitchen, which makes BK adopt various strategies for operating and using the objects, so as to make habitability and the performance of multiple domestic actions possible in a limited space. These objects transform; some are multifunctional, others are built into the walls, they create passages, fold over one another, are suspended from the walls and ceiling, are thrown, fly.\n\nBut let us return to the initial scene. In the rapid prototyping (a drawing that materialises instantly) that BK performs before us in The High Sign, we can see a partial synthesis of the design process. Which, although reductive because it leaves out many important questions in design, was for me a powerful stimulus to resume some reflection on the relations between drawing and design begun in [[#year-2003|2003]] in the project [[#sound-system-series|sound system]].\n\nIn The High Sign we see a drawing turning into a material object that is used. In design, drawing is an unavoidable instrument; it serves multiple purposes: it helps us understand reality, interpret project contexts (human, economic, technological, productive), think, test and feel solutions, communicate results and build material or immaterial objects.\nThe importance and effectiveness of drawing in design does not lie in the intrinsic qualities of the drawing inscribed on the sheet, that is, in the drawing as object, but in what happened while it was made (questions, answers, thoughts, sensations, physical and emotional relationship) and in what can be done with it afterwards (the drawing discovered/contains a solution/path of work, the drawing changed my being, it contributes to my knowledge and sensibility...). Drawing in design is not only operative in relation to a given subject; it is also the builder/shaper of the being who conceives and who experiences the world through it.\n\nIf we look around us we can see that everything around us that is not natural resulted from a process of conception and construction that at some point used drawing. We can say that the drawing that was at the origin of a large part of our artificial world remains latent in the objects, systems and spaces that surround us. We grab it, touch it, we are inside it. We [[#inhabited-drawing|inhabit a drawing]].\n\nThat is why I say that designers are [[#choreographers|choreographers]] of our everyday life; with the help of drawing they conceive our habitat, a relational structure formed by objects, spaces, systems and services that works as a score for the movements, [[#gesture|gestures]] and actions we perform every day. Over the course of our lives these drawings condition our everyday life invisibly; they slowly shape our body, our mind and the way we relate to the world. The work of design is also a work of design of man.", "footnotes": [], "refs": [], "keywords": ["writing", "inhabited-drawing", "choreographers", "design-of-the-human", "latency", "buster-keaton", "drawing", "word-into-object", "filomena-silvano", "helena-almeida", "year-2007", "paint", "humour", "door", "sound-system-series", "gesture"], "images": [], "linked_from": ["brizio-with-keaton", "catalogue-2011", "color-hanger", "latent-objects", "pdb-2023-being-water", "sound-wave-bonbon"]}, {"id": "brizio-with-keaton", "title": "Fernando Brízio with Buster Keaton", "year": 2007, "sheet": [["Title", "Fernando Brízio com Buster Keaton (Fernando Brízio with Buster Keaton)"], ["Year", "2007"], ["Producer", "Fernando Brízio"], ["Original idea", "Fernando Brízio"], ["Direction", "Fernando Brízio and João Pombeiro"], ["Image", "Timecode"], ["Category", "Video"]], "text": "", "footnotes": [], "refs": [], "keywords": ["video", "buster-keaton", "burlesque", "joao-pombeiro", "inhabited-drawing", "word-into-object", "hanger", "filomena-silvano", "year-2007"], "images": [{"id": "i005", "kind": "image", "file": "img/i005.jpg", "caption": "Fernando Brízio with Buster [[#buster-keaton|Keaton]] ([[#year-2007|2007]]), stills: Keaton draws a coat hook on the wall and hangs his hat (\"Later that day...\"); Brízio then draws a [[#stool|stool]] on the floor of the same set.", "credit": "", "info": "1400x1125", "src": "Inhabited Drawing - Fernando Brízio visits Buster Keaton-639.jpg", "wh": [1400, 1125], "v": [480, 960, 1400]}, {"id": "v01", "kind": "video", "file": "img/v01-b.jpg", "caption": "Fernando Brízio with Buster [[#buster-keaton|Keaton]] ([[#year-2007|2007]]), video, 2'38\": Keaton's set from The High Sign; Brízio draws a [[#stool|stool]] in white line on the floor, then sits on it.", "credit": "", "info": "157.8s", "src": "buster-691.mpg", "wh": [384, 288], "v": [384]}], "linked_from": []}, {"id": "alice-stool", "title": "Alice", "year": 2007, "sheet": [["Title", "Alice"], ["Year", "2007"], ["Material", "Wood and metal"], ["Dimensions", "43 x 47 x 45 cm"], ["Commissioned by", "Galerie Kreo, Paris"], ["Producer", "Fernando Brízio"], ["Category", "Limited edition"]], "text": "{sheet}\n\n{img:i001}\n\n{img:i002}\n\n{img:i003}\n\n{img:i004}\n\nIn a rotation movement the four views around the object show us a [[#stool|stool]] with legs that shrink, fold over, stretch or, extends straight beyond the space here it lay. That it is not a physical [[#transformation|transformation]]; it is an optical [[#illusion|illusion]] due to a trompe l’oeil provoked by 4 small metallic sheets, attached underneath the stools legs. It is the shape and the position of these pieces that cause the illusion and the diverse silhouettes. This stool outline is determinate by the viewer’s position in the space. Each and every point of view redesigns the object.\n\n{w:7} {imglist}", "footnotes": [], "refs": [], "keywords": ["wood", "metal", "stool", "illusion", "apparent-movement", "transformation", "limited-edition", "galerie-kreo", "designer-as-author", "didier-krzentowski", "paris", "year-2007"], "images": [{"id": "i001", "kind": "image", "file": "img/i001.jpg", "caption": "[[#stool|Stool]] in [[#illusion|trompe l'oeil]] \"Alice\" ([[#year-2007|2007]]), view 1 of 4: seen from this side the legs stand straight.", "credit": "", "info": "1052x1400", "w": 5, "src": "ALICE 001_1-3260.jpg", "wh": [1052, 1400], "v": [480, 960, 1052]}, {"id": "i002", "kind": "image", "file": "img/i002.jpg", "caption": "[[#stool|Stool]] in [[#illusion|trompe l'oeil]] \"Alice\" ([[#year-2007|2007]]), view 2 of 4: the legs seem to fold outwards at the feet.", "credit": "", "info": "1052x1400", "w": 3, "src": "ALICE 004-3254.jpg", "wh": [1052, 1400], "v": [480, 960, 1052]}, {"id": "i003", "kind": "image", "file": "img/i003.jpg", "caption": "[[#stool|Stool]] in [[#illusion|trompe l'oeil]] \"Alice\" ([[#year-2007|2007]]), view 3 of 4: the legs seem to bend and shrink.", "credit": "", "info": "1052x1400", "w": 2, "src": "ALICE 006-3255.jpg", "wh": [1052, 1400], "v": [480, 960, 1052]}, {"id": "i004", "kind": "image", "file": "img/i004.jpg", "caption": "[[#stool|Stool]] in [[#illusion|trompe l'oeil]] \"Alice\" ([[#year-2007|2007]]), view 4 of 4: small [[#metal|metal]] sheets under the legs make them appear to stretch beyond the floor.", "credit": "", "info": "1052x1400", "w": 2, "src": "ALICE 009-3252.jpg", "wh": [1052, 1400], "v": [480, 960, 1052]}], "laid_out": true, "linked_from": []}, {"id": "sketching-door", "title": "Sketching Door", "year": 2007, "sheet": [["Title", "Sketching Door"], ["Year", "2007"]], "text": "A sliding [[#door|door]] with holes holding [[#graphite|graphite]] sticks on elastic cords. As the door opens they press against the wall and draw its movement, making it permanent. The twin of the [[hb-drawing-shelf|HB Drawing Shelf]]. For [[#carmona-e-costa|Fundação Carmona e Costa]].", "footnotes": [], "refs": [], "keywords": ["wood", "graphite", "door", "drawing-machines", "gesture", "inhabited-drawing", "carmona-e-costa", "vera-sacchetti", "susana-gaudencio", "year-2007"], "images": [], "linked_from": ["hb-drawing-shelf"]}, {"id": "vase-with-roots", "title": "Vase With Roots", "year": 2007, "sheet": [["Title", "Vase With Roots"], ["Year", "2007"]], "text": "[[#wood|Wood]] and bronze [[#vessel|vase]], prototype.", "footnotes": [], "refs": [], "keywords": ["wood", "metal", "vessel", "prototype", "year-2007"], "images": [], "linked_from": []}, {"id": "graphite-containers", "title": "Graphite (containers)", "year": 2007, "sheet": [["Title", "Graphite (containers)"], ["Year", "2007"]], "text": "Storage containers in [[#graphite|graphite]], Massimo Dutti Design Prize.", "footnotes": [], "refs": [], "keywords": ["graphite", "year-2007"], "images": [], "linked_from": []}, {"id": "apartamento-loop", "title": "Apartamento Loop", "year": 2007, "sheet": [["Title", "Apartamento Loop"], ["Year", "2007"]], "text": "Office and library for a two-level show apartment (A.S. Atelier de Santos, [[#porto|Porto]]): a motorised [[#aluminium|aluminium]]-platform office in a 7.5 m void and a hanging-shelf library.", "footnotes": [], "refs": [], "keywords": ["interior", "shelf", "porto", "year-2007", "aluminium"], "images": [], "linked_from": []}, {"id": "restarted-dress", "title": "Restarted Dress", "year": 2008, "sheet": [["Title", "Restarted Dress"], ["Year", "2008"], ["Material", "Fabric and felt-tip pens"], ["Dimensions", "variable"], ["Commissioned by", "Torino World Design Capital"], ["Producer", "Fernando Brízio"], ["Category", "Limited edition"], ["Collection", "MUDE – Museu do Design e da Moda"]], "text": "{sheet}\n\n{img:i230}\n\nThis idea was sketched over the [[clothes-make-up|Clothes Make Up]] skirt, back in [[#year-2005|2005]].\n\nThese are [[#open-objects|open objects]][^1] that act as a palimpsest, that is, they can be altered, erased, rewritten as many times as necessary.\n\n{fn:1}\n\n{img:i218}\n\nMoulded from a white cloth when it is used it is coloured in an autonomous fashion with multiple [[#stain|spots]]. These [[#dress|dresses]] have small pockets in which [[#felt-tip-pen|felt-tip pens]] are placed that, when in contact with the cloth, release coloured [[#paint|paint]] that is absorbed by the [[#fabric|fabrics]]. The pens’ colours, as well as its distribution, are chosen by the wearer of the dress. They are also interchangeable, allowing thus for a new order with each new usage.\nAfterwards, the spots can be removed with a simple washing, so that one can use it once again as new, and apply new spots. Moreover, you can do it in public. The spot takes an average of two and half hours to spread and it can reach from 13 to 15 cm in diameter.\n\n{img:i231}\n\n{space:2}\n\nThe metamorphosis of these objects during a party, a dinner occasion or an opening makes its use as a sort of [[#happening-objects|happening]]: everyone witnesses the [[#transformation|transformation]] of a white object into a colourful one.\nThese happening objects, then, make their wearers as [[#birds-of-paradise|Birds of Paradise]][^2].\n\n{fn:2}\n\n{img:i226}\n\n{img:i227}\n\n{img:i219}\n\n{img:i221}\n\n{img:i220}\n\n{img:i222}\n\n{space:3}\n\n{img:v04}\n\n{w:8} {imglist}", "footnotes": ["[[#open-objects|Open objects]] are objects that were created in such a way by their designers so that they have some kind of device or key-function that allows and calls for the direct intervention of their users. People can alter their shape, colour and even functioning, in accordance to the most adequate use and meaning for the user him- or herself.", "The Birds of Paradise are large [[#birds-of-paradise|birds]] that are found in Papua New Guinea, and that are able to transform themselves physically (shape and colour) during the courtship of the species. This [[#transformation|transformation]] occurs with a series of movements and makes up a beautiful event."], "refs": ["Restarted [[#dress|Dress]], video, 2'47\": the wearer places pens in the pockets; the [[#stain|stains]] spread; the dress is washed in a basin, ready to be used again."], "keywords": ["giotto-series", "fabric", "dress", "felt-tip-pen", "capillarity", "stain", "time", "open-objects", "happening-objects", "transformation", "birds-of-paradise", "love-stories", "limited-edition", "torino-wdc", "turin", "mude", "vera-sacchetti", "filomena-silvano", "guta-moura-guedes", "year-2008", "paint"], "images": [{"id": "i230", "kind": "image", "file": "img/i230.jpg", "caption": "Four [[#dress|dresses]] on stands in a room, shown with a screen.", "credit": "", "info": "1400x933", "w": 2, "src": "sala_vestidos-small-1883.jpg", "wh": [1400, 933], "v": [480, 960, 1400]}, {"id": "i218", "kind": "image", "file": "img/i218.jpg", "caption": "Instruction diagram: a white [[#dress|dress]], pens in its pockets, the dress coloured \"≈ 1h00\" later at a party, dinner or opening, then washed and ready again.", "credit": "", "info": "1400x1400", "w": 2, "src": "3-Dress color small ultima_sem_numeros -small-1772.jpg", "wh": [1400, 1400], "v": [480, 960, 1400]}, {"id": "i231", "kind": "image", "file": "img/i231.jpg", "caption": "Colour tests on [[#fabric|fabric]] samples, red, orange, blue, yellow, black.", "credit": "", "info": "1400x1051", "w": 3, "src": "testes-cor-tecido(3+claro)-small-1888.jpg", "wh": [1400, 1051], "v": [480, 960, 1400]}, {"id": "i226", "kind": "image", "file": "img/i226.jpg", "caption": "A [[#dress|dress]] with blue, red and green [[#stain|stains]] near the waist.", "credit": "", "info": "1078x1400", "w": 3, "src": "restard2(fundonovo)-small-1901.jpg", "wh": [1078, 1400], "v": [480, 960, 1078]}, {"id": "i227", "kind": "image", "file": "img/i227.jpg", "caption": "A [[#dress|dress]] with a small group of [[#stain|stains]] near the hem.", "credit": "", "info": "1078x1400", "w": 2, "src": "restard3(fundonovo)-small-1906.jpg", "wh": [1078, 1400], "v": [480, 960, 1078]}, {"id": "i219", "kind": "image", "file": "img/i219.jpg", "caption": "Two [[#dress|dresses]] with a few pens and [[#stain|stains]]; colour tests on [[#fabric|fabric]] above.", "credit": "", "info": "1400x1051", "w": 3, "src": "Restart 002-small-1572.jpg", "wh": [1400, 1051], "v": [480, 960, 1400]}, {"id": "i221", "kind": "image", "file": "img/i221.jpg", "caption": "The wearer places pens in the pockets.", "credit": "", "info": "1384x1400", "w": 4, "src": "Restarted Dresss 3-1788.jpg", "wh": [1384, 1400], "v": [480, 960, 1384]}, {"id": "i220", "kind": "image", "file": "img/i220.jpg", "caption": "A woman wears the white [[#dress|dress]], its pockets still empty, pen in hand.", "credit": "", "info": "1400x1400", "w": 3, "src": "Restarted Dresss 1-1790.jpg", "wh": [1400, 1400], "v": [480, 960, 1400]}, {"id": "i222", "kind": "image", "file": "img/i222.jpg", "caption": "The [[#dress|dress]] worn, covered in coloured [[#stain|stains]].", "credit": "", "info": "1400x1400", "w": 2, "src": "Restarted Dresss 4pingo_1-1781.jpg", "wh": [1400, 1400], "v": [480, 960, 1400]}, {"id": "v04", "kind": "video", "file": "img/v04-b.jpg", "caption": "Video, 2'47\": the wearer places pens in the pockets; the [[#stain|stains]] spread; the [[#dress|dress]] is washed in a basin, ready to be used again.", "credit": "", "info": "166.9s", "w": 7, "src": "VESTIDO DV PAL 16.9-1793.mov", "wh": [720, 400], "v": [480, 720]}, {"id": "i223", "kind": "image", "file": "img/i223.jpg", "caption": "Two [[#dress|dresses]] on mannequins, densely [[#stain|stained]] in many colours.", "credit": "", "info": "1400x1050", "w": 2, "src": "VESTIDOS_01-1774.png", "wh": [1400, 1050], "v": [480, 960, 1400]}, {"id": "i224", "kind": "image", "file": "img/i224.jpg", "caption": "A [[#dress|dress]] [[#stain|stained]] in yellow and green.", "credit": "", "info": "1400x1400", "w": 3, "src": "fbrizio01-small-1777.jpg", "wh": [1400, 1400], "v": [480, 960, 1400]}, {"id": "i225", "kind": "image", "file": "img/i225.jpg", "caption": "A [[#dress|dress]] [[#stain|stained]] in black.", "credit": "", "info": "1400x1400", "w": 2, "src": "fbrizio02-small-1775.jpg", "wh": [1400, 1400], "v": [480, 960, 1400]}], "lead": "i230", "laid_out": true, "linked_from": ["clothes-make-up", "icon-cover", "painting-with-giotto", "paradisaea"]}, {"id": "icon-cover", "title": "Cover for Icon magazine (no. 062)", "year": 2008, "sheet": [["Title", "Cover for Icon magazine"], ["Year", "2008"], ["Material", "Paper and felt-tip pens"], ["Dimensions", "23 x 30 cm"], ["Production", "Fernando Brízio, Violetta Boxill, Miguel Ângelo Guerreiro"], ["Category", "Photography – Publication"]], "text": "Following an interview done in [[#lisbon|Lisbon]], the editor of [[#icon-magazine|Icon magazine]], [[#justin-mcguirk|Justin McGuirk]], asked me to make the cover of issue no. 062. At the time I had just made the installation [[restarted-dress|Restarted Dress]] for [[#torino-wdc|Torino World Design Capital]]. We therefore decided to take advantage of the same kind of phenomenon explored in that work and in the [[#giotto-series|Giotto series]]: the spreading of inks that happens because of the [[#capillarity|capillarity]] of certain materials. On the cover for Icon I used the capillarity of [[#paper|paper]]. Violetta from ICON sent me a file with the cover text laid out, which I used to place [[#felt-tip-pen|felt-tip pens]] in contact with the surface of the paper; countless combinations and photographs were made until we obtained the published result.", "footnotes": [], "refs": [], "keywords": ["giotto-series", "paper", "felt-tip-pen", "capillarity", "publication", "icon-magazine", "justin-mcguirk", "miguel-angelo-guerreiro", "year-2008", "lisbon", "torino-wdc"], "images": [{"id": "i073", "kind": "image", "file": "img/i073.jpg", "caption": "Cover for Icon no. 062 ([[#year-2008|2008]]), test: [[#felt-tip-pen|felt-tip pens]] standing on the printed cover, their ink spreading into the [[#paper|paper]].", "credit": "", "info": "1119x1400", "src": "ICON_002-1784.jpg", "wh": [1119, 1400], "v": [480, 960, 1119]}, {"id": "i074", "kind": "image", "file": "img/i074.jpg", "caption": "Cover for Icon no. 062 ([[#year-2008|2008]]), test with yellow, red, grey and black pens.", "credit": "", "info": "1104x1400", "src": "ICON_003-3-1785.jpg", "wh": [1104, 1400], "v": [480, 960, 1104]}, {"id": "i075", "kind": "image", "file": "img/i075.jpg", "caption": "Cover for Icon no. 062 ([[#year-2008|2008]]), test with a single red pen.", "credit": "", "info": "1119x1400", "src": "ICON_005-3-1783.jpg", "wh": [1119, 1400], "v": [480, 960, 1119]}, {"id": "i076", "kind": "image", "file": "img/i076.jpg", "caption": "Cover for Icon no. 062 ([[#year-2008|2008]]), test with many pens and overlapping [[#stain|blots]].", "credit": "", "info": "1118x1400", "src": "ICON_006-3-1770.jpg", "wh": [1118, 1400], "v": [480, 960, 1118]}], "linked_from": ["painting-with-giotto"]}, {"id": "color-hanger", "title": "Color Hanger", "year": 2008, "sheet": [["Title", "Color Hanger"], ["Year", "2008"]], "text": "[[#paint|Paint]] squeezed from a tube is solidified by selective [[#laser|laser]] sintering and becomes a [[#hanger|hanger]]. Shown in [[#exh-sotao|Sótão]] ([[#experimentadesign|EXD]]'09). [[#susana-gaudencio|Gaudêncio]] reads it as a [[#transformation|transformation]] close to alchemy and [[#magic|conjuring]]. It recalls the coat hook [[#buster-keaton|Keaton]] paints in [[inhabited-drawing-text|Inhabited Drawing]].", "footnotes": [], "refs": [], "keywords": ["hanger", "paint", "laser", "transformation", "magic", "humour", "exh-sotao", "experimentadesign", "word-into-object", "susana-gaudencio", "year-2008", "buster-keaton"], "images": [], "linked_from": ["fountain-hanger"]}, {"id": "fountain-hanger", "title": "Fountain Hanger", "year": 2008, "sheet": [["Title", "Fountain Hanger"], ["Year", "2008"]], "text": "[[#metal|Metal]] and tubes of [[#acrylic|acrylic]] [[#paint|paint]]. A sibling of [[color-hanger|Color Hanger]].", "footnotes": [], "refs": [], "keywords": ["hanger", "paint", "metal", "year-2008", "acrylic"], "images": [], "linked_from": []}, {"id": "drawing-hanger", "title": "Drawing Hanger", "year": 2008, "sheet": [["Title", "Drawing Hanger"], ["Year", "2008"]], "text": "[[#aluminium|Aluminium]] [[#hanger|hanger]] with a PET wall [[#sticker|sticker]]: half object, half drawing.", "footnotes": [], "refs": [], "keywords": ["hanger", "aluminium", "sticker", "illusion", "inhabited-drawing", "year-2008"], "images": [], "linked_from": []}, {"id": "what-you-see-is-not", "title": "What You See Is Not", "year": 2008, "sheet": [["Title", "What You See Is Not"], ["Year", "2008"]], "text": "Cabinet in [[#wood|wood]] with a PET wall [[#sticker|sticker]], for [[#droog|Droog]].", "footnotes": [], "refs": [], "keywords": ["wood", "sticker", "illusion", "droog", "year-2008"], "images": [], "linked_from": []}, {"id": "protection", "title": "Protection", "year": 2008, "sheet": [["Title", "Protection"], ["Year", "2008"]], "text": "[[#door|Door]] marked by self-inking [[#stamp|stamps]], for [[#carmona-e-costa|Fundação Carmona e Costa]].", "footnotes": [], "refs": [], "keywords": ["door", "stamp", "carmona-e-costa", "year-2008"], "images": [], "linked_from": []}, {"id": "hotel-station", "title": "Hotel Station (4th floor)", "year": 2008, "sheet": [["Title", "Hotel Station (4th floor)"], ["Year", "2008"]], "text": "Two proposals for guiding guests to their rooms: [[#coloured-pencil|coloured-pencil]] room numbers or coloured piping.", "footnotes": [], "refs": [], "keywords": ["interior", "coloured-pencil", "lisbon", "year-2008"], "images": [], "linked_from": []}, {"id": "jardim-de-santos", "title": "Canopy and Restored Kiosk, Jardim de Santos", "year": 2008, "sheet": [["Title", "Canopy and Restored Kiosk, Jardim de Santos"], ["Year", "2008"]], "text": "For [[#experimentadesign|Experimenta Design]] / [[#lisbon|Lisbon]] City Council.", "footnotes": [], "refs": [], "keywords": ["interior", "experimentadesign", "lisbon", "year-2008"], "images": [], "linked_from": []}, {"id": "casticais", "title": "Castiçais (candlesticks)", "year": 2008, "sheet": [["Title", "Castiçais (candlesticks)"], ["Year", "2008"]], "text": "[[#cork|Cork]] candlesticks for Susdesign.", "footnotes": [], "refs": [], "keywords": ["cork", "year-2008"], "images": [], "linked_from": []}, {"id": "sneakers-delight", "title": "Sneakers Delight", "year": 2008, "sheet": [["Title", "Sneakers Delight"], ["Year", "2008"]], "text": "Rubber floor coating for [[#adidas|Adidas]].", "footnotes": [], "refs": [], "keywords": ["adidas", "interior", "year-2008"], "images": [], "linked_from": []}, {"id": "share", "title": "Share", "year": 2008, "sheet": [["Title", "Share"], ["Year", "2008"], ["Material", "Coins"], ["Dimensions", "ø 17 cm"], ["Initiated by", "the author; implemented as a special project at EXD'09"], ["Producer", "EXD'09"], ["Category", "Industrial production"]], "text": "Through an everyday object to which no one is indifferent, which everyone has but no one truly owns, Share proposes, through a subversive strategy (sticking a small [[#sticker|sticker]] on [[#money|banknotes]] and coins), to spread an idea of [[#sharing|solidarity]] silently and surreptitiously.\n\nThe scale of Share is unpredictable, somewhere between an epidemic and a mini-outbreak, confined to a city, a neighbourhood, a home. The effects will be irreversible. The greater the impact, the more positive the result will be.", "footnotes": [], "refs": [], "keywords": ["money", "sticker", "sharing", "industrial-production", "experimentadesign", "year-2008"], "images": [{"id": "i362", "kind": "image", "file": "img/i362.jpg", "caption": "Share ([[#year-2008|2008]]): a hand sticks a red \"Share\" [[#sticker|sticker]] on a €5 note; another note already carries a blue one.", "credit": "", "info": "1051x1400", "src": "AUTO-COLANTE-2.tif", "wh": [1051, 1400], "v": [480, 960, 1051]}, {"id": "i363", "kind": "image", "file": "img/i363.jpg", "caption": "Share ([[#year-2008|2008]]): [[#sticker|stickers]] on two €5 notes.", "credit": "", "info": "1051x1400", "src": "AUTO-COLANTE-4.tif", "wh": [1051, 1400], "v": [480, 960, 1051]}, {"id": "i364", "kind": "image", "file": "img/i364.jpg", "caption": "Share ([[#year-2008|2008]]): a hand presses a red [[#sticker|sticker]] onto a note.", "credit": "", "info": "1051x1400", "src": "AUTO-COLANTE-5.tif", "wh": [1051, 1400], "v": [480, 960, 1051]}, {"id": "i365", "kind": "image", "file": "img/i365.jpg", "caption": "Share ([[#year-2008|2008]]): two €5 notes, each printed with the word \"Share\".", "credit": "", "info": "1051x1400", "src": "NOTA_5€.tif", "wh": [1051, 1400], "v": [480, 960, 1051]}], "linked_from": []}, {"id": "volume-button-earrings", "title": "Volume Button Earrings", "year": 2009, "sheet": [["Title", "Volume Button Earrings (Brincos Botão de Volume)"], ["Year", "2009"], ["Material", "Aluminium"], ["Dimensions", "1.4 x 0.9 cm"], ["Initiated by", "the author"], ["Producer", "Atelier Fernando Brízio"], ["Category", "Prototype"]], "text": "{sheet}\n\n{img:i236}\n\n{w:4} Sometimes, when we are fed up with listening to certain people, we stop listening. These [[#jewellery|earrings]] are for that: they let us imagine that we can regulate the [[#sound|sound]] coming into our ears. For this project I asked [[#carla-cardoso|Carla Cardoso]] and [[#ruy-otero|Ruy Otero]] for help to make [[laura-video|a video]] in which we would see the earrings being worn. She suggested Laura (1944) by Otto [[#laura-1944|Preminger]], where there is a moment of tension in which Laura (Gene Tierney) is questioned by a detective. In the film we made we used parts of that scene: Laura, tired of listening to the detective, turns an earring, lowers the volume of the sound, stops listening. The film becomes [[#silence|silent]].", "footnotes": [], "refs": [], "keywords": ["aluminium", "jewellery", "sound", "silence", "humour", "prototype", "fiction", "year-2009", "carla-cardoso", "ruy-otero", "laura-1944"], "images": [{"id": "i236", "kind": "image", "file": "img/i236.jpg", "caption": "Volume Button [[#jewellery|Earrings]] ([[#year-2009|2009]]): two [[#aluminium|aluminium]] earrings marked + and −.", "credit": "", "info": "1400x1051", "w": 8, "src": "BRINCO_02.tif", "wh": [1400, 1051], "v": [480, 960, 1400]}], "laid_out": true, "linked_from": ["laura-video"]}, {"id": "painting-vase-watercolor", "title": "Painting a Vase With Watercolor", "year": 2009, "sheet": [["Title", "Painting a Vase With Watercolor"], ["Year", "2009"]], "text": "[[#ceramic|Ceramic]], [[#metal|metal]] and [[#paint|watercolours]]. Ceramic prototypes by Estúdio Caldas da Rainha, with the Olfaire factory and model maker Luís Oliveira; finished by Brízio.", "footnotes": [], "refs": [], "keywords": ["painting-with-series", "ceramic", "metal", "paint", "capillarity", "year-2009"], "images": [], "linked_from": []}, {"id": "painting-with-van-gogh", "title": "Painting with Van Gogh", "year": 2009, "sheet": [["Title", "Painting with Van Gogh"], ["Year", "2009"]], "text": "Reproduced in the [[#exh-desenho-habitado|Desenho Habitado]] catalogue. Another painter's name after [[painting-with-giotto|Giotto]].", "footnotes": [], "refs": [], "keywords": ["painting-with-series", "van-gogh", "year-2009", "exh-desenho-habitado"], "images": [], "linked_from": []}, {"id": "target", "title": "Target", "year": 2009, "sheet": [["Title", "Target"], ["Year", "2009"]], "text": "[[#table|Tables]] standing on arrows that \"evoke an [[#animals|insect]] eager to escape\" ([[#vera-sacchetti|Sacchetti]]). For [[#exh-lapse-in-time|Lapse in Time]] (Hans Maier-Aichen).", "footnotes": [], "refs": [], "keywords": ["wood", "table", "animals", "humour", "exh-lapse-in-time", "experimentadesign", "vera-sacchetti", "year-2009"], "images": [], "linked_from": []}, {"id": "float", "title": "Float (humidifier)", "year": 2009, "sheet": [["Title", "Float"], ["Year", "2009"], ["Material", "White ceramic, wood and ping pong ball"], ["Dimensions", "27 x Ø 11 cm"], ["Commissioned by", "Martinispa (IT)"], ["Production", "Martinispa"], ["Category", "Industrial production"], ["Collection", "Il Coccio Design Edition"]], "text": "{sheet}\n\n{img:i235}\n\nDeveloped for [[#il-coccio|Il Coccio]] Design Edition, for whom Achille [[#achille-castiglioni|Castiglioni]] designed, in 1998, the famous Fischietto [[#humidity|humidifier]].\n\n{img:v05}\n\nA completely white [[#ceramic|ceramic]] [[#vessel|bottle]], a float, a black wooden sphere, [[#water|water]]. These are the components of Float, the humidifier to be placed on the radiator, which flirts with the physics of water [[#evaporation|evaporation]], the water level, which determines the ups and downs of the sphere rights up to completely closing the bottle after the evaporation process has been completed.\nThis device shows the level of water inside it.\n\n{w:7} {imglist}", "footnotes": [], "refs": [], "keywords": ["ceramic", "wood", "ping-pong-ball", "water", "evaporation", "humidity", "time", "infra-thin", "being-water", "industrial-production", "il-coccio", "achille-castiglioni", "delfim-sardo", "material-first", "duchamp", "year-2009", "vessel"], "images": [{"id": "i235", "kind": "image", "file": "img/i235.jpg", "caption": "Float ([[#year-2009|2009]]): drawings of the [[#vessel|bottle]] with the float at full and empty; the [[#humidity|humidifier]] on a radiator.", "credit": "", "info": "1400x932", "w": 2, "src": "HUM_5_L4-1519.jpg", "wh": [1400, 932], "v": [480, 960, 1400]}, {"id": "v05", "kind": "video", "file": "img/v05-b.jpg", "caption": "Float ([[#year-2009|2009]]), animation, 1'06\": the [[#humidity|humidifier]] on a radiator; as the [[#water|water]] evaporates the float sinks, until the black sphere closes the [[#vessel|bottle]].", "credit": "", "info": "66.0s", "w": 12, "src": "humificador-fundo-redimensionado_1-341.mov", "wh": [1400, 738], "v": [480, 960, 1400]}], "laid_out": true, "linked_from": []}, {"id": "pincho", "title": "Pincho", "year": 2010, "sheet": [["Title", "Pincho"], ["Year", "2010"]], "text": "[[#wood|Wood]] [[#bowl-plate|bowl]], prototype.", "footnotes": [], "refs": [], "keywords": ["wood", "bowl-plate", "prototype", "year-2010"], "images": [], "linked_from": []}, {"id": "laura-video", "title": "Laura (video)", "year": 2011, "sheet": [["Title", "Laura"], ["Year", "2011"], ["Category", "Video"], ["Original idea", "Fernando Brízio"], ["Direction and post-production", "Ruy Otero"], ["Format", "2'06'', mono, black and white"], ["Source film", "Laura, 1944"]], "text": "Sometimes, when we are fed up with listening to certain people, we stop listening. [[volume-button-earrings|These earrings]] are for that: they let us imagine that we can regulate the [[#sound|sound]] coming into our ears. For this project I asked [[#carla-cardoso|Carla Cardoso]] and [[#ruy-otero|Ruy Otero]] for help to make a video in which we would see the [[#jewellery|earrings]] being worn. She suggested Laura (1944) by Otto [[#laura-1944|Preminger]], where there is a moment of tension in which Laura (Gene Tierney) is questioned by a detective. In the film we made we used parts of that scene: Laura, tired of listening to the detective, turns an earring, lowers the volume of the sound, stops listening. The film becomes [[#silence|silent]].", "footnotes": [], "refs": [], "keywords": ["video", "laura-1944", "silence", "sound", "fiction", "ruy-otero", "carla-cardoso", "burlesque", "parafiction", "year-2011", "jewellery"], "images": [{"id": "v06", "kind": "video", "file": "img/v06-b.jpg", "caption": "Laura ([[#year-2011|2011]]), video, 1'55\": the interrogation scene from Otto [[#laura-1944|Preminger]]'s Laura (1944) with Gene Tierney and the detective.", "credit": "", "info": "114.5s", "src": "Laura (Converted) 1.mov", "wh": [768, 576], "v": [480, 768]}], "linked_from": ["volume-button-earrings"]}, {"id": "umbrella", "title": "Umbrella", "year": 2011, "sheet": [["Title", "Umbrella"], ["Format", "HD, colour, no sound, 2011, PT"], ["Production", "Fernando Brízio"], ["Concept", "Fernando Brízio"], ["Direction", "Salomé Lamas"], ["Editing", "Salomé Lamas and Fernando Brízio"], ["Image", "Vasco Viana"], ["Special effects", "Irmã Lúcia"], ["With", "Cinta Benet and Bruno Moreira"], ["Category", "Video"]], "text": "One day I was going to meet a girl when suddenly it started to [[#rain|rain]] heavily; like a fool, I took shelter under the arcades of a square and waited for the rain to pass. I kept waiting; I had to cross the square but, as it wouldn't stop raining, I waited... When the rain eased, I went to the meeting place, but she had gone. While I waited I wished there were an umbrella in the square that I could use, a [[#sharing|public umbrella]]. An umbrella we could call with a button: it would come to us and then we would cross the square together.", "footnotes": [], "refs": [], "keywords": ["video", "rain", "sharing", "fiction", "love-stories", "time", "silence", "salome-lamas", "vasco-viana", "being-water", "parafiction", "year-2011"], "images": [{"id": "v14", "kind": "video", "file": "img/v14-b.jpg", "caption": "Umbrella ([[#year-2011|2011]]), video, 1'43\", [[#silence|silent]]: in an arcaded courtyard a woman walks under an umbrella; the umbrella then waits in the square on its own.", "credit": "", "info": "103.4s", "src": "Umbrella 01'43 mute, color 2011_1-3244.mov", "wh": [1360, 765], "v": [480, 960, 1360]}], "linked_from": ["petrichor"]}, {"id": "comb-ii", "title": "Comb II", "year": 2011, "sheet": [["Title", "Comb II"], ["Year", "2011"]], "text": "[[#silence|Silent]] HD video of Brízio combing his hair through tree canopies. Direction with [[#salome-lamas|Salomé Lamas]], photography [[#vasco-viana|Vasco Viana]].", "footnotes": [], "refs": [], "keywords": ["video", "silence", "salome-lamas", "vasco-viana", "humour", "year-2011"], "images": [], "linked_from": ["umbrella"]}, {"id": "pote-com-ra", "title": "Pote com Rã / Refresco de Hortelã", "year": 2011, "sheet": [["Title", "Pote com Rã (Pot with Frog)"], ["Year", "2011"], ["Material", "Faience and shellac"], ["Dimensions", "28 x Ø 33 cm"], ["Initiated by", "the author"], ["Producer", "Fernando Brízio and Fábrica de Faianças Artísticas Bordallo Pinheiro"], ["Category", "One-offs / Prototype"]], "text": "Refresco de Hortelã [Mint Refreshment] results from the [[#transformation|transformation]] of the pot Bailado das Rãs [Dance of the Frogs] by Bordalo Pinheiro. Of the seven [[#frog|frogs]] that take part in the dance on the original pot, one remains; leaning over the rim of the pot, it sucks green ink from a [[#vessel|jar]], which spreads over its body because of the [[#capillarity|capillarity]] of the [[#ceramic|faience]].", "footnotes": [], "refs": [], "keywords": ["ceramic", "shellac", "frog", "animals", "capillarity", "giotto-series", "bordallo-pinheiro", "one-off", "prototype", "humour", "more-than-human", "year-2011", "transformation", "vessel"], "images": [{"id": "i278", "kind": "image", "file": "img/i278.jpg", "caption": "Pote com Rã / Refresco de Hortelã ([[#year-2011|2011]]): a white [[#ceramic|faience]] pot; a single [[#frog|frog]] on the rim drinks green ink from a [[#vessel|jar]], the ink spreading over its body.", "credit": "", "info": "1051x1400", "src": "RA_01-small-1580.jpg", "wh": [1051, 1400], "v": [480, 960, 1051]}], "linked_from": ["elefantes", "painting-with-giotto"]}, {"id": "elefantes", "title": "Elefantes", "year": 2011, "sheet": [["Title", "Elefantes"], ["Year", "2011"]], "text": "[[#ceramic|Faience]] [[#bowl-plate|bowl]]/[[#vessel|pot]] made with the [[#bordallo-pinheiro|Bordallo]] Pinheiro factory for its 125th anniversary, using historic moulds, inspired by two [[#elephant|elephants]] that lived behind the factory. Sibling of [[pote-com-ra|Pote com Rã]].", "footnotes": [], "refs": [], "keywords": ["ceramic", "elephant", "animals", "bordallo-pinheiro", "vessel", "more-than-human", "year-2011", "bowl-plate"], "images": [], "linked_from": ["pote-com-ra"]}, {"id": "bisaro", "title": "Bísaro", "year": 2011, "sheet": [["Title", "Bísaro"], ["Year", "2011"]], "text": "[[#cork|Cork]] and [[#wood|wood]] [[#stool|stool]] for [[#amorim|Amorim Cork Composites]] (Bísaro is a Portuguese pig breed, a cousin of [[pata-negra|Pata Negra]]).", "footnotes": [], "refs": [], "keywords": ["cork", "wood", "stool", "amorim", "food", "year-2011"], "images": [], "linked_from": ["pe-de-porco"]}, {"id": "senta", "title": "Senta", "year": 2011, "sheet": [["Title", "Senta"], ["Year", "2011"]], "text": "[[#cork|Cork]] and [[#wood|wood]] [[#stool|stool]] for [[#amorim|Amorim Cork Composites]].", "footnotes": [], "refs": [], "keywords": ["cork", "wood", "stool", "amorim", "year-2011"], "images": [], "linked_from": []}, {"id": "furo", "title": "Furo", "year": 2011, "sheet": [["Title", "Furo"], ["Year", "2011"]], "text": "[[#cork|Cork]] [[#bowl-plate|bowl]] with [[#hb-pencil|pencils]], for [[#amorim|Amorim]]. Pencils again, as in the [[hb-drawing-shelf|HB Drawing Shelf]].", "footnotes": [], "refs": [], "keywords": ["cork", "hb-pencil", "bowl-plate", "amorim", "year-2011"], "images": [], "linked_from": []}, {"id": "how-to-piggyback", "title": "How to Piggyback Your Lifetime Production", "year": 2011, "sheet": [["Title", "How to Piggyback Your Lifetime Production"], ["Year", "2011"]], "text": "Film by [[#salome-lamas|Salomé Lamas]] made for [[#exh-desenho-habitado|Desenho Habitado]]: a dive into Brízio's creative process, his home, studio and life.", "footnotes": [], "refs": [], "keywords": ["video", "salome-lamas", "exh-desenho-habitado", "collecting", "carla-cardoso", "year-2011"], "images": [], "linked_from": []}, {"id": "ca-tape-a-loeil", "title": "Ça Tape à L'Oeil", "year": 2011, "sheet": [["Title", "Ça Tape à L'Oeil"], ["Year", "2011"]], "text": "Second film by [[#salome-lamas|Salomé Lamas]] for [[#exh-desenho-habitado|Desenho Habitado]].", "footnotes": [], "refs": [], "keywords": ["video", "salome-lamas", "exh-desenho-habitado", "illusion", "carla-cardoso", "year-2011"], "images": [], "linked_from": []}, {"id": "pe-de-porco", "title": "Pé de Porco", "year": 2012, "sheet": [["Title", "Pé de Porco"], ["Year", "2012"]], "text": "Agglomerated-cork [[#stool|stool]] for Bench Years, V&A / Established & Sons, London Design Festival. Another pig, after [[pata-negra|Pata Negra]] and [[bisaro|Bísaro]].", "footnotes": [], "refs": [], "keywords": ["cork", "stool", "food", "year-2012"], "images": [], "linked_from": []}, {"id": "monograph-2013", "title": "Fernando Brízio: Product and Interior Design (monograph)", "year": 2013, "sheet": [["Title", "Fernando Brízio: Product and Interior Design (monograph)"], ["Year", "2013"]], "text": "Imprensa Nacional–Casa da Moeda, Coleção D no. 7. Preface by [[#pedro-gadanho|Pedro Gadanho]], photography mainly by [[#miguel-angelo-guerreiro|Miguel Ângelo Guerreiro]].", "footnotes": [], "refs": [], "keywords": ["publication", "pedro-gadanho", "miguel-angelo-guerreiro", "year-2013"], "images": [], "linked_from": []}, {"id": "f-ma", "title": "F=MA", "year": 2017, "sheet": [["Title", "F=MA"], ["Year", "2017"]], "text": "Cabinet of [[#stone|marble]] and steel cable under tension, for the [[#assimagra|Primeira Pedra]] programme; shown in \"Common Sense\", São Paulo.", "footnotes": [], "refs": [], "keywords": ["stone", "metal", "assimagra", "year-2017"], "images": [], "linked_from": []}, {"id": "paradisaea", "title": "Paradisaea – Lux Frágil 20 anos", "year": 2018, "sheet": [["Title", "Paradisaea – Lux Frágil 20 anos"], ["Year", "2018"]], "text": "Brízio curates three installations revisiting twenty years of [[#lux-fragil|Lux Frágil]]'s visual and material culture. Paradisaea is the genus of the [[#birds-of-paradise|birds of paradise]], the same birds the wearers of the [[restarted-dress|Restarted Dress]] become.", "footnotes": [], "refs": [], "keywords": ["curating", "lux-fragil", "birds-of-paradise", "lisbon", "collecting", "year-2018"], "images": [], "linked_from": ["marco-franco-video", "restarted-dress"]}, {"id": "pdb-2021", "title": "Porto Design Biennale 2021 – Desenhar o Presente", "year": 2021, "sheet": [["Title", "Porto Design Biennale 2021 – Desenhar o Presente"], ["Year", "2021"]], "text": "First edition, Brízio as principal curator, under the theme of \"alter-realities\".", "footnotes": [], "refs": [], "keywords": ["curating", "porto-design-biennale", "porto", "year-2021"], "images": [], "linked_from": []}, {"id": "pdb-2023-being-water", "title": "Being Water – Porto Design Biennale 2023", "year": 2023, "sheet": [["Title", "Ser Água — Como fluímos e nos moldamos coletivamente / Being Water — How we flow together and shape each other"], ["Event", "Porto Design Biennale 2023, Porto and Matosinhos"], ["Dates", "19.10.2023 – 03.12.2023"], ["Principal curator", "Fernando Brízio"], ["Curatorial team", "Ivo Poças Martins, Margarida Mendes, Mariana Pestana, Joana Pestana, Miguel Vieira Baptista, Studio Makkink & Bey"], ["Curator of Spain (Galicia)", "David Barro"], ["Curatorial assistant", "Constança Cardoso"], ["Promoted by", "Câmara Municipal do Porto, Câmara Municipal de Matosinhos"], ["Organised by", "esad—idea, Investigação em Design e Arte"], ["Category", "Curating"]], "text": "{sheet}\n\n[[#water|Water]] is everywhere; it shapes everything, it is vital, and life would not be possible without it. It can take many forms, manifesting them simultaneously. It is a powerful lens through which we think about the world and the adaptability of design to the fast and ceaseless changes that have been taking place in “reality”, where the world we know is disintegrating and we still don’t know how the next one will look like.\n\nOur understanding of water is generally superficial and reductive: we perceive it, above all, as a resource, an imprisoned liquid surface, separated from the remaining matter. This restricts the way we relate to it.\n\nThe water demand is expected to outstrip supply by 40%, by 2030. How can we preserve what we still don’t know quite well? In this edition of [[#porto-design-biennale|Porto Design Biennale]], we propose a transdisciplinary laboratory platform dedicated to observation, reflection, creativity, and learning, which will act simultaneously in the visible and invisible, organic and inorganic, and ephemeral spectra of water.\n\nThis platform-laboratory is “hydrated” through six proposals: Promethean Beasts: Shapes of the human · [[#magic|Magic]] Reality: Living with the un/known · Bodies Of Water: Where water becomes common — vegetable matter, meat, mineral · Dynamic Landscapes: Dancing margins, borders that don’t exist · Flying Rivers: Rethinking the sources, uses, and representations of water · Affective Geologies: The living history of a recipe\n\nFrom the interconnection between these six proposals, we aim to develop and present strategies that contribute to acknowledge, repair, restore and cogitate new relationships with the world. In addition to designing better and more efficient uses of water, we must create models of alternative, symbiotic cohabitation between humans and [[#more-than-human|more-than-humans]], a beneficial and sustainable relationality for all. Cooperative and ecological relations that embrace the various spectres of reality and water, in their various forms and places. Instead of the same words and stories, we seek to “hydrate” with new words, bring to light other narratives, talk to strangers, and sow ideas.\n\nFrom the water, we wish to nurture a new lexicon that expands our relational field with the world. Learning from water reveals the complex and intricate web of interdependencies that connects us to the planet as a whole.\n\n## Promethean Beasts: Shapes of the human\n\nEarth and water showed us, through clay, the endless possibilities of modelling forms. The plasticity of clay may have been noticed when humans trod on clayey ground and saw hollows that held water, like the concavities of rocks or of cupped hands.\n\nThe availability of clay in the landscape and the ease of modelling it probably served for the first experiments in shaping matter and for the recognition and development of the capacity for design, central to raising resilience and the chances of human survival, mutual care. In this sense, the statement by the [[#anthropologist|anthropologist]] Margaret Mead is well known: that the first trace of civilisation would be a broken femur that had healed. A healed femur shows that someone cared for another human being, did not leave them alone, carried them, treated their wounds, kept them company and fed them. The design and making of containers to store food made sustenance possible. The lesser need to search for food left us more time to care for one another\n\nClay will have been seminal in the awareness of matter, the body and being, the embodiment and shaping of the human. Perhaps that is why, in the origin myths of some religions, clay is the matter used by the gods to mould beings, and there are even societies that use the same word for clay and flesh.\n\n[[#prometheus|Prometheus]] is one of those gods who, according to Greek mythology, moulded humans from clay. Disobeying Zeus, he stole fire from the gods to give it to humans, ensuring their superiority over the other animals. Prometheus gave humans thought, techniques and the arts, the possibility of progress, in short, civilisation, moving us away from nature, from the place of the wild, of the beasts. In this process the capacity for conception (design) plays a central role, making progress and culture possible. Design understood as a verb, i.e., the human aptitude that expands its capacities. “Designers (...) are [[#choreographers|choreographers]] of our everyday life (…) they organise points, lines and surfaces, (…) they form a relational structure within which we live, which conditions (...) movements and actions that we perform every day. Over the course of our lives this mould invisibly shapes (...) our body, our mind and the way we relate to the world. The work of design is a work that configures man” ([[inhabited-drawing-text|Brízio, 2007]]).\n\nDesign is a process of autopoiesis, that is, of self-formation, of construction of the human. “The work of design is also a work of design of man.” (Brízio, [[#year-2011|2011]]). This understanding holds a relational idea in which objects do not exist separate from us, as if inert beside us; on the contrary, they intertwine with us and transform us, just as we transform them. Objects act in the world and on us; they have a generative power as they move through human lives. They are co-responsible for the way we are human. Things are embodied; they are prolongations, physical and cognitive extensions of the body-mind. Progress based on economic growth and on the concentration of wealth, competition and individualism is destabilising and exhausting natural systems, putting everyone's future at risk. We have become creative beasts (or, to use the terminology of the cognitive zoologist Ivo Jacobs, “Promethean beasts”).\n\nHowever, some indigenous peoples do not aspire to progress as this concept is understood in the West. For them the sense of unity between humans, between humans and more-than-humans, and among more-than-humans prevails over the individual. It is important to pay attention to, show and learn from other forms of the human, to seek alternatives to the anthropocentric, rational Western model, thus promoting respect and care for the whole. To look at diverse worldviews in geographies far from or close to us. To reflect on identity politics and on the metamorphosis of the human that is taking place, provoked by the endless layers of design, namely those produced by the unstoppable digitalisation of the world, which act as accelerators of radical change.\n\n## Magical Reality: Living with the un/known\n\nWater always escapes us; we cannot grasp it. There are many unanswered questions about it or, depending on the point of view, several answers to the same question. Water is a good ‘moisturiser’ for bringing out the magical reality in which we live. At what moment does water stop [[#being-water|being water]] and become plant matter, flesh? Are we inside or outside water? Does it occupy space or is it a space? Water cannot be thought of as one thing; it is many different things at the same time: ice, [[#rain|rain]], blood, sap, ocean, cloud, vapour, sweat, mud, [[#humidity|humidity]]... its form, composition and density are always changing; sometimes it transforms unexpectedly. Apparently docile, it adapts to the places and surfaces it passes through, but it also acts on them and shapes them: earth, rocks, rivers, oceans, plant matter, the heart. Fluid, water penetrates solid matter and mixes with the air; it is never just water; always in motion, it is an absorbent and a solvent, it always contains something. It only becomes empty when purified. It is a dissident material; it shows a significant number of anomalous behaviours that contradict common sense and the laws of physics, such as freezing faster when it is hot rather than cold, or not freezing at a temperature of −50 °C. Water shows us a reality that is not mechanical and linear, mysterious, full of chance and surprises, indecipherable. Water is a reality full of blind [[#stain|spots]] that challenges the very notion of the real, constantly placing us before uncertainties. It presents us with an infinity of possibilities, between fact and [[#fiction|fiction]].\n\nThere is in us a feeling of incompleteness that makes us fabulate the real, create concepts that generate and organise ideas, that comfort, resolve impasses, give meaning to life. We create fictions, worlds to come that nourish our existence and expand our understanding of the world. In this process, as Timothy [[#timothy-morton|Morton]] argues in Realist Magic: Objects, Ontology, Causality (Ann Arbor: Open Humanities Press, MPublishing – University of Michigan Library, [[#year-2013|2013]]), objects are key actors, attributing symbolic power and capacities, sometimes magical, to those who own them. The example of transitional or mediating objects, which may be ordinary everyday objects, is paradigmatic. They can be existential maps, keepers of stories, activators and mediators of memories; they can carry desires, protect and console, be empowering, transforming and much more. They help us deal with experiences of separation and traumatic episodes of loss. Objects occupy a central place in the emotional infrastructure, helping us deal with memory, disorder, commotion, awe, the unknown, fear, love… the intangible. They can become powerful autobiographical anchors, emotional and intellectual companions in our everyday life, where they take on numerous roles.\n\n## Bodies of Water: Where water becomes common — plant matter, flesh and mineral\n\nA human body is 70% water. In our existential entanglement with the material world, water is fertile and omnipresent. Life emerged in water and is not possible without it.\nWater flows through bodies and geographies, through the earth, between flesh and plant matter, perspiration and cloud, breath and wind. Together we shape one another, organic and inorganic, humans and more-than-humans connected through a common water flow – we share the same water that enters and exudes from bodies, and that through biology becomes other matter. \n\nWe are aqueous bodies, porous, hybrid and multiple beings. From this porosity, I think of a collective body in cooperation, coexistence, in empathy and sharing, in preservation and healing, hydration, in nourishing and repairing, in talking to strangers, in caring for the other, essential to our existence. 100,000 years ago our species was not alone on Earth; there were at least four or five other human species. According to some anthropologists and evolutionary biologists such as Brian Hare, Homo sapiens prevailed not because it was the strongest and most physically fit species, but because it was the friendliest. This trait made possible survival, coexistence and cooperation, the sharing of knowledge, care for others, and development.\nTraditional working methods have reduced water to the idea of stock, a resource channelled for use, instead of a source of life present everywhere, in multiple states. These approaches tend to separate, to reduce the world to binary relations of a Cartesian matrix that thinks of reality mechanically. Within this framework, water appears predominantly as a liquid surface, imprisoned for human uses.\n\nThe current situation, resulting from an over-exploitation of resources, from non-redistributed economic growth and from demographic increase, combined with a context marked by profound ecological and socio-economic changes, imposes the need to develop sustainable relationships with planetary resources. We have to look for other kinds of relationships. Instead of separating and imprisoning, we must design an ecological and symbiotic rapprochement between humans, and between humans and non-humans, that includes the various spectra of reality, and water in its various forms and places. Work around water reveals to us a permeable mesh of interdependencies that connects us to the planet as a whole.\n\n## Dynamic Landscapes: Dancing margins, borders that don't exist\n\nThe lines that in cartography delimit the margins and distinguish land from water exist only on maps. The limits between these two masses are fluctuating, undefined and unstable; their exact delimitation is an impossibility. The restless character of water, the cyclical and constant movement of the tides pushed by the gravitational forces of the Earth, the Sun and the Moon, the porosity between land and water, make the margins zones of contact and mixing, places of interpenetration, and not places of division.\n\nIf we walk through an intertidal zone, the limits are constantly changing. The liquid tide covers and uncovers, but between the coming and going it seeps in, soaks into the wet sand, the [[#stone|stones]] and the beings of the ecosystems of these zones. If we imagine the bank of a river, the water circulates in a spiral, depositing and eroding its edge; it is an infinite process of [[#transformation|transformation]]. Water penetrates into the land, first liquid, then in the form of humidity. We do not know when it becomes muddy, then clay and, finally, earth.\n\nThe territory of Porto and [[#porto|Matosinhos]], the cities that host the Porto Design Biennale, was sculpted by rain, by rivers and streams (surface and underground) and by the sea. That is why this is also a proposal for a poetic, aesthetic, political, social, physical and affective relationship with the territory and the landscape, with its surface and underground bodies of water, with the potential of the natural resources of the tidal zones.\n\nAt a time when the rise of the mean sea level is accelerating and the margins, in some places, are going to change significantly, it is important to rethink what and how we should design, respecting and taking advantage of these ephemeral, dynamic and porous water lines. The margin can also be that border where we meet what is foreign to us, the stranger, the excluded, and it is also here that the journey, hope, can begin. The bank of a river or of the sea, places of departure and arrival, a place to reach, a place of encouragement, the beginning of a better life. Today the journey is often made because the water that existed and is needed for subsistence agriculture has become scarce, has disappeared. It is a journey that follows the water ‘imprisoned’ in the so-called more developed economies.\n\n## Flying Rivers: Rethinking the representations of water\n\nThe natural water cycle as it is usually presented offers a rather simplistic and limited explanation of how water circulates around the planet, summing up the world's hydrology as a linear process. Liquid water on the surface of the earth evaporates, clouds form, which break up and fall as rain or snow, becoming a liquid mass again in rivers, lakes, oceans... These generic representations leave out relevant aspects of how water moves, aspects that have to do with the regulation of the climate, the retention and circulation of water in nature in aqueous, plant, animal and other bodies, and its capture and processing for human uses. The perception that there is less and less water has become widespread. However, the amount of water on earth is thought to have remained stable for thousands of years, although population growth and the increase in the number of people replicating Western consumption patterns have led to increased retention of water for human consumption, in water storage and management systems su
